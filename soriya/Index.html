  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { st.kind = b.dataset.k; st.discount = null; draw(); });
  document.getElementById("fPer").onchange = e => { st[st.kind === "mois" ? "month" : "week"] = e.target.value; st.discount = null; draw(); };
  document.getElementById("bPrint").onclick = () => { document.body.classList.add("printing"); window.print(); setTimeout(() => document.body.classList.remove("printing"), 500); };

  let current = null;
  function draw() {
    el.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === st.kind)));
    const sel = document.getElementById("fPer");
    sel.innerHTML = st.kind === "mois"
      ? months.map(m => '<option value="' + m + '"' + (m === st.month ? " selected" : "") + ">" + monthLabel(m) + "</option>").join("")
      : weeks.map(w => '<option value="' + w + '"' + (w === st.week ? " selected" : "") + ">Semaine du " + fmtDate(w) + " au " + fmtDate(addDays(w, 6)) + "</option>").join("");
    const from = st.kind === "mois" ? st.month + "-01" : st.week;
    const to = st.kind === "mois" ? isoDay(new Date(+st.month.slice(0, 4), +st.month.slice(5, 7), 0)) : addDays(st.week, 6);
    const inP = x => { const d = (x.date || "").slice(0, 10); return d >= from && d <= to; };
    // Source par mois : le relevé Ecotime en vigueur s'il est arrivé (c'est ce qu'Ecotime paie), sinon les confirmations.
    const R = DATA.releves || { list: [], lines: [] };
    const relByMonth = {}; R.list.forEach(r => { if (r.current && /^\d{4}-\d{2}$/.test(r.month)) relByMonth[r.month] = r; });
    const ldvBy = {}; M.ldv.forEach(x => { const k = digits(x.number); if (k) ldvBy[k] = x; });
    const confBy = {}; M.conf.forEach(x => { const k = digits(x.number); if (k && x.amount > 0) confBy[k] = x; });
    const entries = [], excluded = [], claim = [], srcMonths = { rel: [], conf: [] };
    let autoDisc = 0;
    for (let m = from.slice(0, 7); m <= to.slice(0, 7); m = addDays(m + "-28", 7).slice(0, 7)) {
      const rel = relByMonth[m];
      const mFrom = from > m + "-01" ? from : m + "-01", mTo = to.slice(0, 7) === m ? to : m + "-31";
      const inM = d => d >= mFrom && d <= mTo;
      if (rel) {
        srcMonths.rel.push(m);
        const relNums = {};
        R.lines.filter(l => l.key === rel.key).forEach(l => {
          const it = releveItem(l);
          if (it.discount !== undefined) { if (st.kind === "mois") autoDisc += it.discount; return; }
          if (!inM(String(l.date).slice(0, 10))) return;
          const k = digits(l.number); relNums[k] = 1;
          const c = confBy[k] || {}, x = { date: l.date, number: l.number, from: l.from, to: l.to, driver: l.driver || c.driver, ldv: ldvBy[k] || c.ldv || null, src: "relevé", conf: confBy[k] || null };
          entries.push({ x: x, items: [it] });
        });
        // Confirmées (non annulées, non exclues) mais absentes du relevé : à réclamer avant de facturer.
        M.conf.filter(x => x.status.indexOf("Archivé") === 0 && x.amount > 0 && inM((x.date || "").slice(0, 10)) && !relNums[digits(x.number)]).forEach(x => claim.push(x));
      } else {
        srcMonths.conf.push(m);
        M.conf.filter(x => x.status.indexOf("Archivé") === 0 && inM((x.date || "").slice(0, 10))).forEach(x => {
          if (x.amount > 0) entries.push({ x: Object.assign(Object.create(x), { src: "confirmation" }), items: courseItems(x) });
          else if (x.amountConf > 0) excluded.push(x);
        });
      }
    }
    const billed = entries.map(e => e.x);
    // Lignes agrégées par produit et prix.
    const agg = {}, det = [];
    entries.forEach(e => e.items.forEach(it => {
      const k = it.product + "|" + it.price; (agg[k] = agg[k] || { product: it.product, price: it.price, qty: 0 }).qty += it.qty;
      det.push({ x: e.x, it: it }); }));
    const lines = Object.values(agg).map(l => Object.assign(l, { total: Math.round(l.qty * l.price * 100) / 100 }))
      .sort((a, b) => productRank(a.product) - productRank(b.product) || a.product.localeCompare(b.product) || a.price - b.price);
    const gross = lines.reduce((t, l) => t + l.total, 0), disc = st.discount === null || st.discount === undefined ? autoDisc : +st.discount || 0;
    const ht = gross - disc, vat = Math.round(ht * 20) / 100, ttc = ht + vat;
    const number = st.number || nextNumber(st.issued);
    const noLdv = billed.filter((x, i) => !x.ldv && !x.cancelled && billed.findIndex(y => digits(y.number) === digits(x.number)) === i), unknown = det.filter(d => / · autre/.test(d.it.product));
    const period = st.kind === "mois" ? monthLabel(st.month) : "semaine du " + fmtDate(from) + " au " + fmtDate(to);
    current = { lines: lines, det: det, number: number, from: from, to: to };
    document.querySelector("#fPer + .count").textContent = billed.length + " course(s) facturée(s)";
    // Facture déjà émise sur la même période (mensuelle) : comparaison ligne à ligne.
    const real = st.kind === "mois" ? F.list.filter(f => f.month === st.month).pop() : null;
    document.getElementById("iSum").innerHTML =
      tile("Total HT", EUR2.format(ht), "<em class='muted' style='font-weight:400'>" + billed.length + " course(s) · " + period + "</em>", "hero") +
      tile("TVA 20 %", EUR2.format(vat), "<em class='muted' style='font-weight:400'>TTC " + EUR2.format(ttc) + "</em>") +
      tile("Sans lettre de voiture", String(noLdv.length), "<em class='" + (noLdv.length ? "down" : "up") + "'>" + (noLdv.length ? "preuve manquante" : "toutes prouvées ✔") + "</em>") +
      (real ? tile("Facture émise " + real.number, EUR2.format(real.ht), "<em class='" + (Math.abs(real.ht - ht) < 0.01 ? "up'>identique ✔" : "down'>écart " + EUR2.format(ht - real.ht)) + "</em>")
        : tile("Exclues du CA", String(excluded.length), "<em class='muted' style='font-weight:400'>doublons, non réalisées…</em>"));
    // Points à vérifier.
    const warn = [];
    warn.push("<li><b>Source</b> : " + (srcMonths.rel.length ? "relevé Ecotime en vigueur (" + srcMonths.rel.map(monthLabel).join(", ") + ") — ce qu'Ecotime a validé et paiera" : "") +
      (srcMonths.rel.length && srcMonths.conf.length ? " ; " : "") + (srcMonths.conf.length ? "confirmations d'affrètement (" + srcMonths.conf.map(monthLabel).join(", ") + ") — <b>provisoire</b> tant que le relevé du mois n'est pas arrivé" : "") +
      (autoDisc && st.kind === "mois" ? ". Remise reprise du relevé (licence) : " + EUR2.format(autoDisc) : "") + ".</li>");
    if (claim.length) warn.push("<li><b>" + claim.length + " course(s) confirmée(s) absente(s) du relevé</b> (" + EUR2.format(claim.reduce((t, x) => t + x.amount, 0)) + " HT) : à réclamer à Ecotime ou à ajouter à la facture. " +
      claim.slice(0, 10).map(x => "n° " + esc(x.number) + (x.ldv ? " (lettre ✔)" : "")).join(", ") + (claim.length > 10 ? "…" : "") + "</li>");
    if (noLdv.length) warn.push('<li><b>' + noLdv.length + " course(s) sans lettre de voiture</b> : " + (srcMonths.conf.length ? "facturées sur la foi de la confirmation ou du relevé. " : "payées au relevé, sans preuve archivée. ") + noLdv.slice(0, 12).map(x => "n° " + esc(x.number)).join(", ") + (noLdv.length > 12 ? "…" : "") + ' <a href="#/rapprochement" target="_self">Rapprochement →</a></li>');
    if (unknown.length) warn.push("<li><b>" + unknown.length + " prestation(s) à un tarif hors grille</b> (libellé à vérifier) : " + unknown.slice(0, 8).map(d => "n° " + esc(d.x.number) + " (" + EUR2.format(d.it.price) + ")").join(", ") + "</li>");
    if (excluded.length) warn.push("<li><b>" + excluded.length + " confirmation(s) non facturée(s)</b> : " + excluded.slice(0, 8).map(x => "n° " + esc(x.number) + " — " + esc(x.adj || "montant nul")).join(" ; ") + "</li>");
    if (real) { const rl = F.lines.filter(l => l.key === real.key), diffs = [];
      const by = {}; lines.forEach(l => { by[l.product.toLowerCase()] = l; });
      rl.forEach(l => { const m = by[l.product.toLowerCase()]; if (!m || Math.abs(m.qty - l.qty) > 0.01 || Math.abs(m.price - l.price) > 0.01) diffs.push(esc(l.product) + " : facture " + l.qty + " × " + EUR2.format(l.price) + " / Soriya " + (m ? m.qty + " × " + EUR2.format(m.price) : "absent")); });
      lines.forEach(l => { if (!rl.some(r => r.product.toLowerCase() === l.product.toLowerCase())) diffs.push(esc(l.product) + " : absent de la facture / Soriya " + l.qty + " × " + EUR2.format(l.price)); });
      warn.push("<li><b>Comparaison avec la facture émise " + esc(real.number) + "</b> (" + EUR2.format(real.ht) + " HT" + (real.discount ? " après remise de " + EUR2.format(real.discount) : "") + ") : " +
        (diffs.length ? diffs.length + " ligne(s) différente(s)<ul class='small'>" + diffs.map(d => "<li>" + d + "</li>").join("") + "</ul>" : "toutes les lignes correspondent ✔") + "</li>"); }
    document.getElementById("iWarn").innerHTML = warn.length ? '<div class="card" style="margin-bottom:16px"><h2>À vérifier avant d\'émettre</h2><ul class="small" style="margin:0;padding-left:18px">' + warn.join("") + "</ul></div>" : "";
    // Aperçu imprimable.
    const due = addDays(st.issued, INVOICE_DUE_DAYS);
    Object.assign(current, { gross: gross, disc: disc, ht: ht, vat: vat, ttc: ttc, issued: st.issued, due: due, count: billed.length, provisional: srcMonths.conf.length > 0 });
    document.getElementById("iDoc").innerHTML = !billed.length ? '<div class="card"><p class="muted" style="margin:0">Aucune course confirmée sur cette période.</p></div>' :
      '<div class="inv"><div class="hd"><div style="display:flex;gap:14px;align-items:center"><div style="width:72px;height:72px;flex:none">' + GFD_LOGO + '</div><div><h1>' + esc(COMPANY.name) + "</h1>" + COMPANY.lines.map(l => '<div class="small">' + esc(l) + "</div>").join("") + '</div></div>' +
      '<div class="to"><div style="font-size:20px;font-weight:800">FACTURE</div><div class="small">Client</div><b>' + esc(CLIENT.name) + "</b></div></div>" +
      '<div class="meta"><div><span>N° facture</span><input class="inl" id="iNum" value="' + esc(number) + '"><b class="ponly">' + esc(number) + '</b></div><div><span>Émise le</span><input class="inl" type="date" id="iIss" value="' + st.issued + '"><b class="ponly">' + fmtDate(st.issued) + "</b></div>" +
      "<div><span>Échéance</span>" + fmtDate(due) + "</div><div><span>Période</span>" + fmtDate(from) + " → " + fmtDate(to) + "</div></div>" +
      '<table><thead><tr><th>Produit</th><th class="num">Qté</th><th>Unité</th><th class="num">Prix u. HT</th><th class="num">TVA</th><th class="num">Total HT</th></tr></thead><tbody>' +
      lines.map(l => "<tr><td>" + esc(l.product) + '</td><td class="num">' + String(Math.round(l.qty * 100) / 100).replace(".", ",") + "</td><td>" + (l.qty > 1 ? "unités" : "unité") +
        '</td><td class="num">' + EUR2.format(l.price) + '</td><td class="num">20 %</td><td class="num">' + EUR2.format(l.total) + "</td></tr>").join("") + "</tbody></table>" +
      '<div class="tot"><div><span>Total HT avant remise</span><span>' + EUR2.format(gross) + '</span></div><div><span>Remise</span><span>− <input class="inl" id="iDisc" inputmode="decimal" style="width:6em;text-align:right" value="' +
      (disc ? String(disc).replace(".", ",") : "0") + '"><span class="scr"> €</span><b class="ponly" style="font-weight:400">' + EUR2.format(disc) + "</b></span></div>" + '<div><span>Total HT</span><span>' + EUR2.format(ht) + "</span></div><div><span>TVA 20 %</span><span>" + EUR2.format(vat) +
      '</span></div><div class="big"><span>Total TTC</span><span>' + EUR2.format(ttc) + "</span></div></div>" +
      '<div class="foot">Transport et manutention du ' + fmtDate(from) + " au " + fmtDate(to) + " · " + billed.length + " course(s). Paiement à " + INVOICE_DUE_DAYS + " jours, échéance le " + fmtDate(due) + ".</div></div>";
    const num = document.getElementById("iNum"); if (num) num.onchange = e => { st.number = e.target.value.trim(); draw(); };
    const iss = document.getElementById("iIss"); if (iss) iss.onchange = e => { if (e.target.value) { st.issued = e.target.value; draw(); } };
    const dsc = document.getElementById("iDisc"); if (dsc) dsc.onchange = e => { st.discount = amt(e.target.value) || 0; draw(); };
    dataTable(document.getElementById("iDet"), det, [
      { key: "date", label: "Date", val: d => d.x.date, html: d => fmtDate(d.x.date) }, { key: "number", label: "N°", nw: true, val: d => d.x.number },
      { key: "route", label: "Trajet", val: d => city(d.x.from) + " → " + city(d.x.to) }, { key: "driver", label: "Chauffeur", sm: true, val: d => d.x.driver || "—" },
      { key: "product", label: "Produit", val: d => d.it.product }, { key: "total", label: "HT", num: true, val: d => d.it.qty * d.it.price, html: d => EUR2.format(d.it.qty * d.it.price) },
      { key: "src", label: "Source", sm: true, val: d => d.x.src }, { key: "ldv", label: "Lettre", val: d => d.x.ldv ? "oui" : "non", html: d => d.x.ldv ? "✔" : '<span class="pill warn">manquante</span>' },
    ], { state: (st.det = st.det || {}), sort: "date", onRow: d => { const t = d.x.src === "relevé" ? (d.x.conf || d.x.ldv) : d.x; if (t) openDoc(t); } });
  }
  document.getElementById("bDrive").onclick = () => { if (!current || !current.lines.length) return;
    if (current.provisional && !confirm("Facture provisoire (relevé Ecotime du mois pas encore arrivé). L'enregistrer quand même ?")) return;
    const btn = document.getElementById("bDrive"); btn.disabled = true; btn.textContent = "Enregistrement…";
    google.script.run.withSuccessHandler(r => { btn.disabled = false; btn.textContent = "Enregistrer en PDF dans le Drive";
        document.getElementById("iSaved").innerHTML = '<div class="card" style="margin-bottom:16px">✔ <b>' + esc(r.name) + '</b> enregistrée dans le Drive. <a href="' + esc(r.url) + '">Ouvrir le PDF ↗</a> · <a href="' + esc(r.folderUrl) + '">Dossier « Préparées par Soriya » ↗</a></div>'; })
      .withFailureHandler(err => { btn.disabled = false; btn.textContent = "Enregistrer en PDF dans le Drive";
        alert("PDF non enregistré : " + err.message + "\n\nSi Google demande une autorisation, rechargez la page et acceptez l'accès à Google Drive."); })
      .soriyaWebSaveInvoicePdf(invoicePdfHtml(current), current.number, current.from, KEY); };
  document.getElementById("bCsv").onclick = () => { if (!current) return;
    downloadCsv("facture-" + current.number, [["N° facture", "Produit", "Qté", "Prix u. HT", "Total HT"]].concat(current.lines.map(l => [current.number, l.product, String(l.qty).replace(".", ","), String(l.price).replace(".", ","), String(l.total).replace(".", ",")]))
      .concat([[], ["Date", "N° course", "Trajet", "Chauffeur", "Produit", "HT", "Lettre de voiture"]]).concat(current.det.map(d => [d.x.date.slice(0, 10), d.x.number, city(d.x.from) + " → " + city(d.x.to), d.x.driver || "", d.it.product, String(d.it.qty * d.it.price).replace(".", ","), d.x.ldv ? "oui" : "non"]))); };
  draw();
}

/* ---------- Planning / dispatch : affecter les courses confirmées aux chauffeurs ---------- */
const isoDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
// Heures lues dans les remarques de la confirmation (« enlèvement prévu à 09:00 », « livraison prévue avant 12:00 »).
const hhmm = (s, re) => { const m = re.exec(String(s || "")); return m ? m[1].padStart(2, "0") + ":" + m[2] : ""; };
const pickupTime = x => hhmm(x.remarks, /enl[eè]vement[^\d]{0,30}(\d{1,2})\s*[:hH]\s*(\d{2})/i);
const deliveryTime = x => hhmm(x.remarks, /livraison[^\d]{0,30}(\d{1,2})\s*[:hH]\s*(\d{2})/i);

function pagePlanning(el) {
  const today = isoDay(new Date());
  const st = view.plan = view.plan || { day: today };
  const plan = DATA.planning = DATA.planning || {}, checks = DATA.checks || {};
  const dayLabel = d => { const x = new Date(d + "T12:00:00"), t = DAYS[x.getDay()]; return t[0].toUpperCase() + t.slice(1) + " " + x.getDate() + " " + MONTHS[x.getMonth()]; };
  el.innerHTML = '<div class="toolbar"><span class="daynav"><button type="button" data-d="-1" aria-label="Jour précédent">‹</button>' +
    '<button type="button" data-d="0">Aujourd\'hui</button><button type="button" data-d="1">Demain</button>' +
    '<button type="button" data-d="+1" aria-label="Jour suivant">›</button><b id="pDay"></b></span>' +
    '<input type="date" id="pDate" aria-label="Choisir un jour" style="margin-left:auto">' + "</div>" +
    '<p class="muted small" style="margin:-4px 0 12px">Affectez chaque course confirmée par Ecotime à un chauffeur. Quand la lettre de voiture arrive, elle fait foi : la course passe « Lettre reçue ». ' +
    "Le rappel WhatsApp de 19 h 30 n'est envoyé qu'au chauffeur affecté.</p>" +
    '<div class="grid g4" id="pSum" style="margin-bottom:16px"></div><div class="board" id="pBoard"></div>' +
    '<div style="margin-top:16px">' + fold("Espace chauffeur : liens personnels", '<div id="pAccess"></div>', false) + "</div>";
  const setDay = d => { st.day = d; draw(); };
  el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    const v = b.dataset.d; setDay(v === "0" ? today : v === "1" ? addDays(today, 1) : addDays(st.day, +v)); });
  document.getElementById("pDate").onchange = e => { if (e.target.value) setDay(e.target.value); };

  const situation = (x, drv) => { const c = checks[digits(x.number)] || {};
    if (x.ldv) return { k: "ldv", cls: "ok", txt: "✔ Lettre reçue" };
    if (c.v === "NON") return { k: "off", cls: "bad", txt: "Non réalisée — " + (c.motif || "?") };
    if (x.cancelled) return { k: "off", cls: "bad", txt: "Annulée" };
    if (x.replacedBy) return { k: "off", cls: "warn", txt: "Doublon probable" };
    if (c.v === "OUI") return { k: "ok", cls: "ok", txt: "Réalisée" };
    return drv ? { k: "set", cls: "info", txt: "Affectée" } : { k: "todo", cls: "warn", txt: "À affecter" }; };

  // Liens de l'espace chauffeur (créés par Soriya, onglet « Accès chauffeurs ») : copier ou envoyer sur WhatsApp.
  const acc = (DATA.driverAccess || []).filter(a => a.driver && a.url);
  document.getElementById("pAccess").innerHTML = !acc.length ? '<p class="muted small" style="margin:0">Les liens apparaissent après le prochain passage de Soriya.</p>' :
    '<p class="muted small" style="margin:0 0 10px">Chaque chauffeur ouvre son lien sur son téléphone (sans compte Google) : il voit ses courses du jour, envoie sa lettre de voiture et déclare un incident. Ne partagez un lien qu\'avec son chauffeur.</p>' +
    acc.map(a => '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><b style="min-width:90px">' + esc(a.driver) + "</b>" +
      '<button type="button" data-copy="' + esc(a.url) + '">Copier le lien</button>' +
      (a.phone ? '<a class="small" href="https://wa.me/' + esc(digits(a.phone).replace(/^0/, "33")) + "?text=" + encodeURIComponent("Bonjour " + a.driver + ", voici votre espace chauffeur GFD Logistic (vos courses du jour, envoi des lettres de voiture, incidents) : " + a.url) + '" target="_blank" rel="noopener">Envoyer par WhatsApp ↗</a>' : "") +
      '<a class="small" href="' + esc(a.url) + '" target="_blank" rel="noopener">Ouvrir ↗</a></div>').join("");
  document.querySelectorAll("#pAccess [data-copy]").forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = "Copié ✔"; }, () => prompt("Lien :", b.dataset.copy)); });
  const incBy = {}; (DATA.incidents || []).forEach(i => { if (i.n) (incBy[i.n] = incBy[i.n] || []).push(i); });

  function draw() {
    const day = st.day;
    document.getElementById("pDay").textContent = dayLabel(day) + (day === today ? " · aujourd'hui" : day === addDays(today, 1) ? " · demain" : "");
    document.getElementById("pDate").value = day;
    const list = M.conf.filter(x => x.status.indexOf("Archivé") === 0 && !x.dupOf && x.amountConf > 0 && (x.date || "").slice(0, 10) === day)
      .map(x => { const p = plan[digits(x.number)] || null, drv = x.ldv ? (x.ldv.driver || (p || {}).driver || "") : (p || {}).driver || "";
        return { x: x, p: p, drv: drv, sit: situation(x, drv), t: pickupTime(x), tl: deliveryTime(x) }; })
      .sort((a, b) => (a.t || "99").localeCompare(b.t || "99") || digits(a.x.number).localeCompare(digits(b.x.number)));
    const active = list.filter(j => j.sit.k !== "off"), ca = active.reduce((t, j) => t + j.x.amount, 0);
    const todo = list.filter(j => !j.drv && j.sit.k !== "off"), got = list.filter(j => j.x.ldv);
    const drivers = (DATA.drivers || []).slice();
    list.forEach(j => { if (j.drv && drivers.indexOf(j.drv) < 0) drivers.push(j.drv); });
    document.getElementById("pSum").innerHTML =
      tile("Courses du jour", String(active.length), "<em class='muted' style='font-weight:400'>" + EUR.format(ca) + " HT confirmés</em>", "hero") +
      tile("À affecter", String(todo.length), "<em class='" + (todo.length ? "down" : "up") + "'>" + (todo.length ? "chauffeur à choisir" : "tout est affecté ✔") + "</em>") +

      return '<div class="job' + (j.sit.k === "off" ? " off" : "") + '" data-i="' + list.indexOf(j) + '">' +
        '<div class="r1"><span class="t">' + (j.t || "—:—") + '</span><span class="small muted">' + (j.tl ? "→ avant " + j.tl : "") + '</span><span class="n">n° ' + esc(x.number) + "</span></div>" +
        '<div class="rt">' + esc(cap(city(x.from))) + " → " + esc(cap(city(x.to))) + "</div>" +
        '<div class="ft"><span class="pill ' + j.sit.cls + '">' + esc(j.sit.txt) + '</span><span class="small muted">' + EUR.format(x.amountConf) + "</span>" + sel + "</div>" +
        (incBy[n] || []).map(i => '<div class="small" style="margin-top:6px"><span class="pill warn">⚠ ' + esc(i.type) + (i.minutes ? " · " + esc(i.minutes) + " min" : "") + "</span> " + esc(i.comment) +
          (i.photo ? ' <a href="' + esc(i.photo) + '" target="_blank" rel="noopener">photo ↗</a>' : "") + "</div>").join("") + "</div>"; };
    const lane = (title, jobs, cls) => '<div class="lane ' + (cls || "") + '"><h3>' + esc(title) + '<span class="meta">' + jobs.length + " course" + (jobs.length > 1 ? "s" : "") +
      (jobs.length ? " · " + EUR.format(jobs.filter(j => j.sit.k !== "off").reduce((t, j) => t + j.x.amount, 0)) : "") + "</span></h3>" +
      (jobs.map(card).join("") || '<div class="empty-lane">' + (cls === "todo" ? "Rien à affecter." : "Aucune course.") + "</div>") + "</div>";
    document.getElementById("pBoard").innerHTML = !list.length
      ? '<div class="card"><p class="muted" style="margin:0">Aucune course confirmée par Ecotime pour ce jour' + (day > today ? " pour l'instant : les confirmations arrivent en général la veille." : ".") + "</p></div>"
      : lane("À affecter", todo, "todo") + drivers.map(d => lane(d, list.filter(j => j.drv === d))).join("") +
        (list.some(j => !j.drv && j.sit.k === "off") ? lane("Annulées / non réalisées", list.filter(j => !j.drv && j.sit.k === "off")) : "");
    const board = document.getElementById("pBoard");
    board.querySelectorAll(".job").forEach(c => c.addEventListener("click", e => { if (e.target.closest("select")) return; openDoc(list[+c.dataset.i].x); }));
    board.querySelectorAll("select[data-n]").forEach(sel => sel.addEventListener("change", () => {
      const n = sel.dataset.n, v = sel.value; sel.disabled = true;
      google.script.run.withSuccessHandler(r => { if (v) plan[n] = r; else delete plan[n]; M = derive(DATA); draw(); })
        .withFailureHandler(err => { sel.disabled = false;
          alert("Affectation non enregistrée : " + err.message + "\n\nSi Google demande une autorisation, rechargez la page et acceptez « modifier vos feuilles de calcul »."); })
        .soriyaWebSetChauffeur(n, v, KEY); }));
  }
  draw();
}

function pageMatch(el) {
  const st = view.match = view.match || { month: M.thisMonth };
  el.innerHTML = '<div class="toolbar"><select id="fMonth">' + monthOptions(M.conf, st.month) + '</select><span class="muted small">Une course est rapprochée quand la lettre de voiture porte le même numéro que la confirmation. Les relevés et factures Ecotime disent si une course sans lettre a été annulée.</span></div>' +
    '<div class="grid g4" id="mSum" style="margin-bottom:16px"></div>' +
    '<div class="card"><h2>Courses sans lettre de voiture à traiter</h2><p class="muted small" style="margin:-4px 0 10px">Cochez « Réalisée » si le chauffeur a bien fait la course : elle sort de la liste. Sinon, choisissez le motif (annulation, modification, incident, autre).</p><div id="t1"></div></div>' +
    fold("Déjà traitées : réalisées, non réalisées, annulées, remplacées", '<div id="t1done"></div>', false, '<span class="muted" style="font-weight:400">(<span id="t1doneN">0</span>)</span>') +
    '<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Annulations : facture ↔ relevé ↔ confirmations</h2><div id="tAnn"></div></div><div class="card"><h2>Lettres sans confirmation</h2><div id="t2"></div></div></div>';
  // Situation d'une course sans lettre de voiture : relevé Ecotime, doublons, réponse « course réalisée ? ».
  const checks = DATA.checks = DATA.checks || {};
  const MOTIFS = ["Annulation", "Modification", "Incident", "Autre"];
  const situation = x => { const c = checks[digits(x.number)] || {};
    if (c.v === "OUI") return { k: "oui", done: true, cls: "ok", txt: "Réalisée (confirmé)" + (x.paid > 0 ? " · payée " + EUR2.format(x.paid) : "") };
    if (c.v === "NON") return { k: "non", done: true, cls: "bad", txt: "Non réalisée — " + (c.motif || "motif à préciser") + (x.paid > 0 ? " · payée " + EUR2.format(x.paid) + " : à signaler à Ecotime" : "") };
    if (x.cancelled) return { k: "ann", done: true, cls: "ok", txt: "Annulée · payée ½ tarif (" + EUR2.format(x.paid) + ")" };
    if (x.replacedBy) return { k: "rep", done: x.releveRead, cls: x.releveRead ? "ok" : "warn", txt: (x.releveRead ? "Remplacée" : "Doublon probable") + " par n° " + x.replacedBy.number + " (même trajet, même jour)" };
    return x.paid > 0 ? { k: "real", cls: "warn", txt: "Payée " + EUR2.format(x.paid) + " · lettre manquante" }
      : x.releveRead ? { k: "abs", cls: "bad", txt: "Absente du relevé · à réclamer ou annulée sans frais" }
      : { k: "wait", cls: "", txt: "Relevé du mois pas encore reçu" }; };
  // Réponse : case « Réalisée » (OUI) ou motif de non-réalisation (NON + motif).
  const answer = x => { const n = digits(x.number), c = checks[n] || {};
    return '<div class="ans"><label class="chk" title="' + esc(c.by ? "Répondu par " + c.by + " le " + c.at : "") + '"><input type="checkbox" data-chk="' + esc(n) + '"' + (c.v === "OUI" ? " checked" : "") + "> Réalisée</label>" +
      '<select data-motif="' + esc(n) + '"><option value="">' + (c.v === "NON" ? "Non : " + esc(c.motif || "?") : "Non réalisée : motif…") + "</option>" +
      MOTIFS.map(m => '<option value="' + m + '">' + m + "</option>").join("") + (c.v ? '<option value="__reset">↺ Remettre à vérifier</option>' : "") + "</select></div>"; };
  const draw = () => {
    const inM = x => !st.month || (x.date || "").slice(0, 7) === st.month;
    const conf = M.conf.filter(x => inM(x) && x.amountConf > 0 && x.status.indexOf("Archivé") === 0 && !x.dupOf);
    const all = conf.filter(x => !x.ldv); all.forEach(x => { x.sit = situation(x); });
    const miss = all.filter(x => !x.sit.done), done = all.filter(x => x.sit.done);
    const n = k => miss.filter(x => x.sit.k === k).length, nd = k => done.filter(x => x.sit.k === k).length;
    // Annulations facturées (lignes « Annulations Courses… » des factures GFD du mois).
    const F = DATA.factures || { list: [], lines: [] }, invMonth = {}; F.list.forEach(f => { invMonth[f.key] = f.month; });
    const annLines = F.lines.filter(l => /annul/i.test(l.product) && (!st.month || invMonth[l.key] === st.month));
    const annQty = annLines.reduce((t, l) => t + l.qty, 0), annAmt = annLines.reduce((t, l) => t + l.total, 0);
    const annRel = M.cancelLines.filter(l => !st.month || l.month === st.month);
    const orph = M.orphanLdv.filter(inM);
    document.getElementById("mSum").innerHTML = tile("Courses confirmées", String(conf.length), "<em class='muted' style='font-weight:400'>" + Math.round((conf.length - all.length) / (conf.length || 1) * 100) + " % avec lettre de voiture</em>", "hero") +
      tile("Sans lettre à traiter", String(miss.length), "<em class='muted' style='font-weight:400'>" + n("real") + " payée(s) · " + n("abs") + " absente(s) du relevé · " + n("wait") + " en attente" + (n("rep") ? " · " + n("rep") + " doublon(s) probable(s)" : "") + "</em>") +
      tile("Déjà traitées", String(done.length), "<em class='muted' style='font-weight:400'>" + nd("oui") + " réalisée(s) · " + nd("non") + " non réalisée(s) · " + (nd("ann") + nd("rep")) + " annulée(s)/remplacée(s)</em>") +
      tile("Annulations facturées", String(annQty), "<em class='muted' style='font-weight:400'>" + EUR2.format(annAmt) + " HT sur la facture</em>");
    const cols = [
      { key: "date", label: "Date", html: x => fmtDate(x.date) }, { key: "number", label: "N°", nw: true },
      { key: "route", label: "Trajet", val: x => city(x.from) + " → " + city(x.to) }, { key: "driver", label: "Chauffeur", sm: true, val: x => x.driver || "—" },
      { key: "amountConf", label: "Confirmé HT", num: true, html: x => EUR2.format(x.amountConf) },
      { key: "sit", label: "Situation", val: x => x.sit.txt, html: x => '<span class="pill ' + x.sit.cls + '">' + esc(x.sit.txt) + "</span>" },
      { key: "chk", label: "Course réalisée ?", val: x => (checks[digits(x.number)] || {}).v || "", html: answer },
    ];
    dataTable(document.getElementById("t1"), miss, cols, { state: (st.t1 = st.t1 || {}), sort: "date", onRow: openDoc,
      foot: (rs, c) => c.key === "date" ? "Total" : c.key === "number" ? rs.length + " course(s)" : c.key === "amountConf" ? EUR2.format(rs.reduce((t, x) => t + x.amountConf, 0)) : "" });
    dataTable(document.getElementById("t1done"), done, cols.concat([{ key: "amount", label: "Retenu au CA", num: true, html: x => EUR2.format(x.amount) }]),
      { state: (st.t1d = st.t1d || {}), sort: "date", onRow: openDoc,
        foot: (rs, c) => c.key === "date" ? "Total" : c.key === "number" ? rs.length + " course(s)" : c.key === "amount" ? EUR2.format(rs.reduce((t, x) => t + x.amount, 0)) : "" });
    document.getElementById("t1doneN").textContent = done.length;
    // Enregistrement des réponses (OUI : la course sort de la liste ; NON : motif obligatoire).
    const save = (n, v, motif, ctl) => {
      ctl.disabled = true;
      google.script.run.withSuccessHandler(r => { if (v) checks[n] = r; else delete checks[n]; M = derive(DATA); draw(); })
        .withFailureHandler(err => { ctl.disabled = false;
          alert("Réponse non enregistrée : " + err.message + "\n\nSi Google demande une autorisation, rechargez la page et acceptez « modifier vos feuilles de calcul »."); })
        .soriyaWebSetRealisee(n, v, motif, KEY);
    };
    ["t1", "t1done"].forEach(id => { const host = document.getElementById(id);
      host.querySelectorAll(".ans").forEach(a => a.addEventListener("click", e => e.stopPropagation()));
      host.querySelectorAll("input[data-chk]").forEach(inp => inp.addEventListener("change", () => save(inp.dataset.chk, inp.checked ? "OUI" : "", "", inp)));
      host.querySelectorAll("select[data-motif]").forEach(sel => sel.addEventListener("change", () => {
        let m = sel.value; if (!m) return;
        if (m === "__reset") return save(sel.dataset.motif, "", "", sel);
        if (m === "Autre") { const t = prompt("Motif (autre) :", ""); if (t === null) { sel.value = ""; return; } m = "Autre : " + t.trim(); }
        save(sel.dataset.motif, "NON", m, sel); })); });
    // Annulations : facture vs relevé (ordres payés au tarif d'annulation) vs confirmations et lettres reçues.
    const gap = annQty - annRel.length;
    document.getElementById("tAnn").innerHTML = '<div class="minis"><div><span>Sur la facture</span><b>' + annQty + "</b></div><div><span>Au relevé (½ tarif)</span><b>" + annRel.length + "</b></div><div><span>Écart</span><b>" + (gap > 0 ? "+" : "") + gap + "</b></div></div>" +
      (annRel.length ? '<div class="table-wrap" style="border:0;margin-bottom:12px"><table><thead><tr><th>Ordre annulé</th><th class="num">Payé</th><th>Confirmation</th><th>Lettre</th></tr></thead><tbody>' +
        annRel.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(l => "<tr><td>" + fmtDate(l.date) + " · n° " + esc(l.number) + '<div class="sub">' + esc(l.driver) + " · " + esc(l.service) + '</div></td><td class="num">' + EUR2.format(l.amount) + "</td><td>" +
          (l.conf ? (Math.abs(l.conf.amount - l.amount) < 0.01 ? '<span class="pill ok">✔ ' + EUR2.format(l.conf.amount) + "</span>" : '<span class="pill warn">confirmée ' + EUR2.format(l.conf.amount) + "</span>") : '<span class="pill bad">non reçue</span>') +
          "</td><td>" + (l.ldv ? "✔" : "—") + "</td></tr>").join("") + "</tbody></table></div>" : "") +
      (annLines.length ? '<div class="table-wrap" style="border:0"><table><thead><tr><th>Ligne de facture</th><th class="num">Qté</th><th class="num">Prix u.</th><th class="num">Total HT</th></tr></thead><tbody>' +
        annLines.map(l => "<tr><td>" + esc(l.product) + '<div class="sub">' + esc(l.number) + '</div></td><td class="num">' + l.qty + '</td><td class="num">' + EUR2.format(l.price) + '</td><td class="num">' + EUR2.format(l.total) + "</td></tr>").join("") + "</tbody></table></div>" :
        '<p class="muted small">Aucune annulation sur la facture de cette période (ou facture pas encore reçue).</p>') +

      { key: "sit", label: "Relevé Ecotime", val: x => x.cancelled ? "Annulée" : x.paid > 0 ? "Payée" : "Absente",
        html: x => x.cancelled ? '<span class="pill ok">Annulée · ' + EUR2.format(x.paid) + "</span>" : x.paid > 0 ? '<span class="pill warn">Payée ' + EUR2.format(x.paid) + " · confirmation non reçue</span>" :
          M.relMonths[(x.date || "").slice(0, 7)] ? '<span class="pill bad">Absente du relevé</span>' : '<span class="pill">relevé pas encore reçu</span>' },
      { key: "rel", label: "Relance Ecotime", val: x => ((DATA.relances || {})[digits(x.number)] || {}).status || "",
        html: x => { const r = (DATA.relances || {})[digits(x.number)]; if (!r) return '<span class="muted small">—</span>';

    ], { state: (st.t2 = st.t2 || {}), sort: "date", onRow: openDoc });
  };
  document.getElementById("fMonth").onchange = e => { st.month = e.target.value; draw(); };
  draw();
}

/* ---------- Statistique sous-traitant (relevés mensuels d'Ecotime) ---------- */
function pageSubcontractors(el) {
  const R = DATA.releves || { list: [], lines: [] };
  const cur = R.list.filter(r => r.current && /^\d{4}-\d{2}$/.test(r.month)).sort((a, b) => b.month.localeCompare(a.month));
  const folder = R.folderUrl ? '<a class="more" href="' + esc(R.folderUrl) + '">Dossier des relevés ↗</a>' : "";
  if (!cur.length) {
    el.innerHTML = '<div class="card"><h2>Statistique sous-traitant détaillée ' + folder + '</h2><p class="muted">' +
      (R.error ? esc(R.error) : "Soriya range et lit les relevés mensuels d'Ecotime (mails « LISTING … ») : les premiers résultats apparaissent ici au fil des passages (0 h, 8 h, 14 h et 20 h).") + "</p></div>";
    return;
  }
  const st = view.sub = view.sub || { month: cur[0].month };
  if (!cur.some(r => r.month === st.month)) st.month = cur[0].month;
  const salesBy = m => M.sales.filter(x => x.date.slice(0, 7) === m);
  const linesOf = r => R.lines.filter(l => l.key === r.key);
  el.innerHTML = '<div class="toolbar"><select id="fMonth">' + cur.map(r => '<option value="' + r.month + '"' + (r.month === st.month ? " selected" : "") + ">" + monthLabel(r.month) + "</option>").join("") +
    '</select><span class="muted small">Relevés « Statistique sous-traitant détaillée » envoyés par Ecotime chaque mois : ce qu\'Ecotime vous paie, ordre par ordre.</span></div>' +
    '<div class="grid g4" id="sSum" style="margin-bottom:16px"></div>' +
    '<div class="grid g2"><div class="card"><h2>Par sous-traitant</h2><div id="sSt"></div></div><div class="card"><h2>Par sous-traitant et par prestation</h2><div id="sMx"></div></div></div>' +
    '<div class="card" style="margin-top:16px"><h2>Relevé ↔ confirmations reçues</h2><div id="sChk"></div></div>' +
    fold("Ordres du relevé (détail ligne par ligne)", '<div class="toolbar" style="margin:0 0 8px"><select id="fSt"></select></div><div id="sLines"></div>') +
    fold("Tous les relevés", '<div id="sAll"></div>', false, folder);
  const table = (head, rows, foot) => '<div class="table-wrap" style="border:0"><table><thead><tr>' + head.map(h => '<th class="' + (h.num ? "num" : "") + '">' + esc(h.l) + "</th>").join("") + "</tr></thead><tbody>" +
    (rows.length ? rows.join("") : '<tr><td colspan="' + head.length + '" class="muted">Aucune ligne.</td></tr>') + "</tbody>" + (foot ? "<tfoot>" + foot + "</tfoot>" : "") + "</table></div>";
  const td = (v, num) => '<td class="' + (num ? "num" : "") + '">' + v + "</td>";
  const draw = () => {
    const r = cur.find(x => x.month === st.month), lines = linesOf(r), sales = salesBy(r.month);
    const caConf = sales.reduce((t, x) => t + x.amount, 0), allRead = r.sts.every(x => x.read);
    const gap = r.total - caConf;
    document.getElementById("sSum").innerHTML = tile("Total HT du relevé", EUR2.format(r.total), "<em class='muted' style='font-weight:400'>" + monthLabel(r.month) + (r.edited ? " · édité le " + esc(r.edited) : "") + "</em>", "hero") +
      tile("Ordres payés", String(r.orders)) + tile("CA des confirmations reçues", EUR2.format(caConf), "<em class='muted' style='font-weight:400'>" + sales.length + " confirmation(s)</em>") +
      tile("Écart relevé − confirmations", (gap > 0 ? "+" : "") + EUR2.format(gap), "<em class='" + (Math.abs(gap) < 1 ? "up" : "down") + "'>" + (Math.abs(gap) < 1 ? "concordant" : gap > 0 ? "confirmations manquantes ?" : "courses non payées ?") + "</em>");
    // Par sous-traitant (totaux imprimés sur le relevé).
    // Un sous-traitant peut figurer dans plusieurs agences (Ecotime 95, QUICKSHIP…) : regroupé par chauffeur.
    const byDrv = {}; r.sts.forEach(x => { const g = (byDrv[x.driver] = byDrv[x.driver] || { driver: x.driver, code: x.code, names: [], orders: 0, total: 0, read: true });
      g.orders += x.orders; g.total += x.total; g.read = g.read && x.read; const lbl = x.name + (x.agency ? " · " + x.agency : ""); if (g.names.indexOf(lbl) < 0) g.names.push(lbl); });
    const tot = r.sts.reduce((t, x) => t + x.total, 0), ord = r.sts.reduce((t, x) => t + x.orders, 0);
    document.getElementById("sSt").innerHTML = table([{ l: "Sous-traitant" }, { l: "Ordres", num: 1 }, { l: "Total HT", num: 1 }, { l: "Moy. / ordre", num: 1 }, { l: "Part", num: 1 }],
      Object.values(byDrv).sort((a, b) => b.total - a.total).map(x => '<tr data-d="' + esc(x.driver) + '" style="cursor:pointer">' + td(esc(x.driver) + '<div class="sub">' + esc(x.names.join(" ; ")) + (x.read ? "" : " · détail en cours de lecture") + "</div>") +
        td(x.orders, 1) + td(EUR2.format(x.total), 1) + td(EUR2.format(x.orders ? x.total / x.orders : 0), 1) + td(Math.round(x.total / (tot || 1) * 100) + " %", 1) + "</tr>"),
      "<tr><td>Total</td>" + td(ord, 1) + td(EUR2.format(tot), 1) + td(EUR2.format(ord ? tot / ord : 0), 1) + td("100 %", 1) + "</tr>");
    document.querySelectorAll("#sSt tr[data-d]").forEach(tr => tr.onclick = () => { st.driver = st.driver === tr.dataset.d ? "" : tr.dataset.d; drawLines(); });
    // Matrice sous-traitant × prestation (lignes lues).
    const svc = l => { const p = String(l.service || "").toUpperCase(); return /FOURGON/.test(p) ? "FOURGON" : /BREAK/.test(p) ? "BREAK" : /^GV/.test(p) ? "GV" : p || "Autre"; };
    const svcs = Array.from(new Set(lines.map(svc))).sort((a, b) => { const o = k => { const i = ["GV", "FOURGON", "BREAK"].indexOf(k); return i < 0 ? 9 : i; }; return o(a) - o(b) || a.localeCompare(b); });
    const mx = {}; lines.forEach(l => { const d = (mx[l.driver] = mx[l.driver] || { n: 0, ca: 0 }), k = svc(l); d.n++; d.ca += l.amount; (d[k] = d[k] || { n: 0, ca: 0 }); d[k].n++; d[k].ca += l.amount; });
    const cell = c => c ? td(EUR2.format(c.ca) + '<div class="sub">' + c.n + " ordre" + (c.n > 1 ? "s" : "") + "</div>", 1) : td('<span class="muted">—</span>', 1);
    const colTot = k => lines.filter(l => svc(l) === k).reduce((o, l) => (o.n++, o.ca += l.amount, o), { n: 0, ca: 0 });
    document.getElementById("sMx").innerHTML = lines.length ? table([{ l: "Sous-traitant" }].concat(svcs.map(k => ({ l: k, num: 1 })), [{ l: "Total", num: 1 }]),
      Object.keys(mx).sort((a, b) => mx[b].ca - mx[a].ca).map(d => "<tr>" + td(esc(d)) + svcs.map(k => cell(mx[d][k])).join("") + cell(mx[d]) + "</tr>"),
      "<tr><td>Total</td>" + svcs.map(k => cell(colTot(k))).join("") + cell({ n: lines.length, ca: lines.reduce((t, l) => t + l.amount, 0) }) + "</tr>") +
      (allRead ? "" : '<p class="muted small">Détail partiel : Soriya lit encore certains sous-traitants.</p>') : '<p class="muted">Détail des ordres en cours de lecture par Soriya.</p>';
    // Rapprochement avec les confirmations.
    const inRel = {}; lines.forEach(l => { const k = digits(l.number); if (k) inRel[k] = (inRel[k] || 0) + l.amount; });
    const confNum = {}; M.conf.forEach(x => { const k = digits(x.number); if (k) confNum[k] = x; });
    const paidNoConf = lines.filter(l => digits(l.number) && !confNum[digits(l.number)] && l.amount > 0);
    // Une confirmation renvoyée (modifiée) peut figurer deux fois : on garde la dernière reçue par numéro.
    const uniq = {}; sales.slice().sort((a, b) => String(a.received).localeCompare(String(b.received))).forEach(x => { const k = digits(x.number); if (k) uniq[k] = x; });
    const confNotPaid = Object.values(uniq).filter(x => !(digits(x.number) in inRel));
    const diff = Object.values(uniq).filter(x => digits(x.number) in inRel && Math.abs(inRel[digits(x.number)] - x.amount) >= 0.01);
    const lst = (title, rows, empty) => '<div><h3 style="font-size:14px;margin:8px 0">' + title + " (" + rows.length + ")</h3>" + (rows.length ? table(rows[0].h, rows.map(x => x.tr)) : '<p class="muted small">' + empty + "</p>") + "</div>";
    const H1 = [{ l: "Date" }, { l: "N° ordre" }, { l: "Sous-traitant" }, { l: "Trajet" }, { l: "HT", num: 1 }];
    const H2 = [{ l: "Date" }, { l: "N°" }, { l: "Chauffeur" }, { l: "Trajet" }, { l: "Confirmation", num: 1 }, { l: "Relevé", num: 1 }];
    document.getElementById("sChk").innerHTML = !lines.length ? '<p class="muted">Disponible quand Soriya aura lu le détail des ordres.</p>' :
      '<div class="grid">' +
      lst("⚠ Confirmations absentes du relevé", confNotPaid.map(x => ({ h: H2, tr: "<tr>" + td(fmtDate(x.date)) + td(esc(x.number)) + td(esc(x.driver || "—")) + td(esc(city(x.from) + " → " + city(x.to))) + td(EUR2.format(x.amount), 1) + td("—", 1) + "</tr>" })), "Toutes les confirmations du mois figurent sur le relevé.") +
      lst("Montants différents", diff.map(x => ({ h: H2, tr: "<tr>" + td(fmtDate(x.date)) + td(esc(x.number)) + td(esc(x.driver || "—")) + td(esc(city(x.from) + " → " + city(x.to))) + td(EUR2.format(x.amount), 1) + td(EUR2.format(inRel[digits(x.number)]), 1) + "</tr>" })), "Aucun écart de montant.") +
      lst("Ordres payés sans confirmation reçue", paidNoConf.map(l => ({ h: H1, tr: "<tr>" + td(fmtDate(l.date)) + td(esc(l.number)) + td(esc(l.driver)) + td(esc(l.from + " → " + l.to)) + td(EUR2.format(l.amount), 1) + "</tr>" })), "Chaque ordre payé a sa confirmation.") +
      "</div>" + (allRead ? "" : '<p class="muted small">Détail encore partiel : ces listes se complètent au fil des passages.</p>');
    drawLines();
    // Tous les relevés, y compris les versions remplacées.
    const all = R.list.slice().sort((a, b) => b.month.localeCompare(a.month) || (b.current - a.current));
    const sumT = cur.reduce((t, x) => t + x.total, 0), sumO = cur.reduce((t, x) => t + x.orders, 0), sumC = cur.reduce((t, x) => t + salesBy(x.month).reduce((u, y) => u + y.amount, 0), 0);
    document.getElementById("sAll").innerHTML = table([{ l: "Mois" }, { l: "Fichier" }, { l: "Ordres", num: 1 }, { l: "Total relevé", num: 1 }, { l: "Confirmations", num: 1 }, { l: "Écart", num: 1 }],
      all.map(x => { const c = salesBy(x.month).reduce((t, y) => t + y.amount, 0);
        return '<tr class="' + (x.month === st.month && x.current ? "on" : "") + '">' + td(esc(/^\d{4}-\d{2}$/.test(x.month) ? monthLabel(x.month) : "—") + (x.current ? "" : '<div class="sub">version remplacée</div>')) +
          td('<a href="' + esc(x.url) + '">' + esc(x.name) + " ↗</a>" + '<div class="sub">' + esc(x.subject) + (x.edited ? " · édité le " + esc(x.edited) : "") + "</div>") +
          td(x.orders, 1) + td(EUR2.format(x.total), 1) + td(x.current ? EUR2.format(c) : "", 1) + td(x.current ? (x.total - c > 0 ? "+" : "") + EUR2.format(x.total - c) : "", 1) + "</tr>"; }),
      "<tr><td>Total (versions en vigueur)</td><td></td>" + td(sumO, 1) + td(EUR2.format(sumT), 1) + td(EUR2.format(sumC), 1) + td((sumT - sumC > 0 ? "+" : "") + EUR2.format(sumT - sumC), 1) + "</tr>");
  };
  const drawLines = () => {
    const r = cur.find(x => x.month === st.month), lines = linesOf(r);
    const drivers = Array.from(new Set(lines.map(l => l.driver))).sort();
    if (st.driver && drivers.indexOf(st.driver) < 0) st.driver = "";

    sel.innerHTML = '<option value="">Tous les sous-traitants</option>' + drivers.map(d => '<option value="' + esc(d) + '"' + (d === st.driver ? " selected" : "") + ">" + esc(d) + "</option>").join("");
    sel.onchange = e => { st.driver = e.target.value; drawLines(); };
    const confNum = {}; M.conf.forEach(x => { const k = digits(x.number); if (k) confNum[k] = x; });
    const rows = lines.filter(l => !st.driver || l.driver === st.driver).map(l => Object.assign({}, l, { conf: confNum[digits(l.number)] || null }));

      { key: "service", label: "Prestation" }, { key: "amount", label: "HT", num: true, html: x => EUR2.format(x.amount) },
      { key: "conf", label: "Confirmation", val: x => x.conf ? "✓ reçue" : "absente" },
    ], { state: (st.lt = st.lt || {}), sort: "date", onRow: x => x.conf && openDoc(x.conf),
      foot: (rs, c) => c.key === "date" ? "Total" : c.key === "number" ? rs.length + " ordre(s)" : c.key === "amount" ? EUR2.format(rs.reduce((t, x) => t + x.amount, 0)) : c.key === "conf" ? rs.filter(x => !x.conf).length + " absente(s)" : "" });
    document.querySelectorAll("#sSt tr[data-d]").forEach(tr => tr.classList.toggle("on", tr.dataset.d === st.driver));
  };
  document.getElementById("fMonth").onchange = e => { st.month = e.target.value; st.driver = ""; draw(); };
  draw();
}

  if (!list.length) {
    el.innerHTML = '<div class="card"><h2>Factures ' + folder + '</h2><p class="muted">' + (F.error ? esc(F.error) :
      "Soriya range et lit vos factures (fichiers « Facture-… » envoyés en réponse aux mails d'Ecotime) : elles apparaissent ici au fil des passages.") + "</p></div>";
    return;
  }
  const st = view.inv = view.inv || { number: list[0].number };
  if (!byNum[st.number]) st.number = list[0].number;
  const today = new Date().toISOString().slice(0, 10);

  const relOf = m => (R.list.find(r => r.current && r.month === m) || null);

    /FOURG/.test(p) ? "FOURGON" : /BREAK/.test(p) ? "BREAK" : /PROVINCE/.test(p) ? "GV Province" : /GV/.test(p) ? "GV" : "Autres"; };
  const year = today.slice(0, 4), ytd = list.filter(x => (x.issued || "").slice(0, 4) === year);
  const sum = (a, k) => a.reduce((t, x) => t + x[k], 0);

    tile("Facturé HT en " + year, EUR2.format(sum(ytd, "ht")), "<em class='muted' style='font-weight:400'>" + ytd.length + " facture(s) · " + EUR2.format(sum(ytd, "ttc")) + " TTC</em>", "hero") +
    tile("Dernière facture", list[0].number, "<em class='muted' style='font-weight:400'>" + (list[0].month ? monthLabel(list[0].month) : "") + " · " + EUR2.format(list[0].ttc) + " TTC</em>") +
    tile("À échoir (TTC)", EUR2.format(sum(due, "ttc")), "<em class='muted' style='font-weight:400'>" + due.length + " facture(s) pas encore à échéance</em>") +
    tile("Échéance passée (TTC)", EUR2.format(sum(overdue, "ttc")), "<em class='muted' style='font-weight:400'>" + overdue.length + " facture(s) · paiement à vérifier en banque</em>") + "</div>" +
    '<div class="card"><h2>Toutes les factures ' + folder + '</h2><div id="iAll"></div></div>' +
    '<div class="card" style="margin-top:16px"><h2 id="iTitle"></h2><div id="iDet"></div></div>' +
    fold("Facturé HT par prestation et par mois", '<div id="iMx"></div>');
  const table = (head, rows, foot) => '<div class="table-wrap" style="border:0"><table><thead><tr>' + head.map(h => '<th class="' + (h.num ? "num" : "") + '">' + esc(h.l) + "</th>").join("") + "</tr></thead><tbody>" +
    (rows.length ? rows.join("") : '<tr><td colspan="' + head.length + '" class="muted">Aucune ligne.</td></tr>') + "</tbody>" + (foot ? "<tfoot>" + foot + "</tfoot>" : "") + "</table></div>";
  const td = (v, num) => '<td class="' + (num ? "num" : "") + '">' + v + "</td>";
  const sign = v => (v > 0 ? "+" : "") + EUR2.format(v);
  const draw = () => {

      list.map(x => { const r = relOf(x.month), gap = r ? x.ht - r.total : null;
        return '<tr data-n="' + esc(x.number) + '" style="cursor:pointer" class="' + (x.number === st.number ? "on" : "") + '">' +
          td("<b>" + esc(x.number) + '</b><div class="sub"><a href="' + esc(x.url) + '">' + esc(x.name) + " ↗</a></div>") +
          td(x.month ? monthLabel(x.month) : "—") + td(fmtDate(x.issued)) +
          td(fmtDate(x.due) + (x.due ? ' <span class="pill ' + (x.due < today ? "warn" : "ok") + '">' + (x.due < today ? "échue" : "à échoir") + "</span>" : "")) +

      "<tr><td>Total</td><td>" + list.length + " facture(s)</td><td></td><td></td>" + td(EUR2.format(sum(list, "ht")), 1) + td(EUR2.format(sum(list, "vat")), 1) + td(EUR2.format(sum(list, "ttc")), 1) + "<td></td><td></td></tr>");

    // Détail de la facture choisie.

    const foot = [["Total HT avant remise", x.gross]].concat(x.discount ? [["Remise", -x.discount]] : [], [["Total HT", x.ht], ["TVA", x.vat], ["Total TTC", x.ttc]]);

/* ---------- Documents administratifs (dossier sous-traitant) ---------- */
function pageAdmin(el) {
  const A = DATA.admin || { list: [] };
  const folder = A.folderUrl ? '<a class="more" href="' + esc(A.folderUrl) + '">Dossier des documents ↗</a>' : "";
  if (!A.list.length) {
    el.innerHTML = '<div class="card"><h2>Documents administratifs ' + folder + '</h2><p class="muted">' + (A.error ? esc(A.error) :
      "Soriya range et lit vos documents administratifs (Kbis, attestations, demandes d'Ecotime…) : ils apparaissent ici au fil des passages.") + "</p></div>";
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  const addMonths = (d, n) => { const x = new Date(d + "T12:00:00"); x.setMonth(x.getMonth() + n); return x.toISOString().slice(0, 10); };
  // Validité : date imprimée, sinon règle d'Ecotime (Kbis de moins de 3 mois, attestation URSSAF de moins de 6 mois).
  const RULES = { "Extrait Kbis": 3, "Attestation de vigilance URSSAF": 6 };
  const expiry = x => /^\d{4}-\d{2}-\d{2}$/.test(x.validUntil) ? x.validUntil : RULES[x.type] && /^\d{4}-\d{2}-\d{2}/.test(x.date) ? addMonths(x.date.slice(0, 10), RULES[x.type]) : "";
  const days = d => Math.round((new Date(d + "T12:00:00") - new Date(today + "T12:00:00")) / 86400000);
  const state = x => { const e = expiry(x); if (!e) return { cls: "ok", txt: "reçu" };
    const n = days(e); return n < 0 ? { cls: "warn", txt: "expiré depuis le " + fmtDate(e) } : n <= 30 ? { cls: "warn", txt: "expire dans " + n + " j" } : { cls: "ok", txt: "valide jusqu'au " + fmtDate(e) }; };
  const docs = A.list.filter(x => x.type !== "Demande de documents").sort((a, b) => (b.date || b.received).localeCompare(a.date || a.received));
  const asks = A.list.filter(x => x.type === "Demande de documents").sort((a, b) => (b.date || b.received).localeCompare(a.date || a.received));
  const TRACK = ["Extrait Kbis", "Attestation de vigilance URSSAF", "Attestation d'assurance", "Licence de transport", "Attestation de paiement"];
  const lastOf = t => docs.find(x => x.type === t) || null;
  const alerts = TRACK.map(lastOf).filter(x => x && state(x).cls === "warn");
  const kbis = lastOf("Extrait Kbis");
  el.innerHTML = '<div class="grid g4" style="margin-bottom:16px">' +
    tile("Documents classés", String(A.list.length), "<em class='muted' style='font-weight:400'>" + docs.length + " pièce(s) · " + asks.length + " demande(s) d'Ecotime</em>", "hero") +
    tile("Extrait Kbis", kbis ? fmtDate(kbis.date) : "aucun", kbis ? '<em class="' + (state(kbis).cls === "ok" ? "up" : "down") + '">' + state(kbis).txt + "</em>" : "") +
    tile("Pièces à renouveler", String(alerts.length), alerts.length ? '<em class="down">' + esc(alerts.map(x => x.type).join(", ")) + "</em>" : "<em class='up'>dossier à jour</em>") +
    tile("Dernière demande d'Ecotime", asks[0] ? fmtDate(asks[0].date || asks[0].received) : "aucune", asks[0] ? "<em class='muted' style='font-weight:400'>" + esc(short(asks[0].requested || asks[0].summary, 60)) + "</em>" : "") + "</div>" +
    '<div class="grid g2"><div class="card"><h2>État du dossier sous-traitant</h2><div id="aState"></div><p class="muted small" style="margin:8px 0 0">Ecotime demande un Kbis de moins de 3 mois et une attestation URSSAF de moins de 6 mois : Soriya calcule l\'échéance quand le document n\'en imprime pas.</p></div>' +
    '<div class="card"><h2>Demandes d\'Ecotime</h2><div id="aAsk"></div></div></div>' +
    fold("Tous les documents", '<div id="aAll"></div>', false, folder);
  const table = (head, rows) => '<div class="table-wrap" style="border:0"><table><thead><tr>' + head.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
    (rows.length ? rows.join("") : '<tr><td colspan="' + head.length + '" class="muted">Aucun document.</td></tr>') + "</tbody></table></div>";
  const pill = s => '<span class="pill ' + s.cls + '">' + esc(s.txt) + "</span>";
  const link = x => '<a href="' + esc(x.url) + '">' + esc(x.name) + " ↗</a>";
  document.getElementById("aState").innerHTML = table(["Pièce", "Dernier document", "État"], TRACK.map(t => { const x = lastOf(t);
    return "<tr><td>" + esc(t) + "</td><td>" + (x ? fmtDate(x.date) + '<div class="sub">' + link(x) + "</div>" : '<span class="muted">aucun reçu</span>') + "</td><td>" + (x ? pill(state(x)) : '<span class="muted">—</span>') + "</td></tr>"; }));
  // Une demande est « traitée » si un document a été reçu après elle.
  document.getElementById("aAsk").innerHTML = table(["Date", "Pièces demandées", "Suite"], asks.map(x => { const d = x.received || x.date;
    const asked = y => String(x.requested + " " + x.summary).toLowerCase().indexOf(y.type.split(" ").pop().toLowerCase()) >= 0; // ex. « Kbis »
    const answer = docs.filter(y => (y.received || "") >= d).sort((a, b) => asked(b) - asked(a) || a.received.localeCompare(b.received))[0];
    return "<tr><td>" + fmtDate(x.date || d) + '<div class="sub">' + link(x) + "</div></td><td>" + esc(x.requested || x.summary) + (x.deadline ? '<div class="sub">à fournir avant le ' + fmtDate(x.deadline) + "</div>" : "") +
      "</td><td>" + (answer ? pill({ cls: "ok", txt: "répondu" }) + '<div class="sub">le ' + fmtDate(answer.received) + " · " + esc(answer.type) + "</div>" : pill({ cls: "warn", txt: "sans réponse" })) + "</td></tr>"; }));
  document.getElementById("aAll").innerHTML = table(["Date", "Type", "Émetteur", "Contenu", "Validité", "Fichier"], A.list.slice().sort((a, b) => (b.date || b.received).localeCompare(a.date || a.received)).map(x =>
    "<tr><td>" + fmtDate(x.date || x.received) + '<div class="sub">reçu le ' + fmtDate(x.received) + "</div></td><td><b>" + esc(x.type) + "</b>" + (x.ref ? '<div class="sub">' + esc(x.ref) + "</div>" : "") +
    "</td><td>" + esc(x.issuer) + "</td><td>" + esc(x.summary) + (x.requested ? '<div class="sub">Demandé : ' + esc(x.requested) + "</div>" : "") + "</td><td>" +
    (x.type === "Demande de documents" ? "" : pill(state(x))) + "</td><td>" + link(x) + "</td></tr>"));
}

    '<div class="card"><h2>Dépendance au premier client ' + (share <= goal ? '<span class="pill ok">✔ objectif atteint</span>' : '<span class="pill bad">▲ forte</span>') + "</h2>" +
      '<div style="font-size:44px;font-weight:700;line-height:1">' + Math.round(share * 100) + ' %<small class="muted" style="font-size:14px;font-weight:500"> ' + esc(top.key) + "</small></div>" +
      '<div class="meter"><i style="width:' + Math.round(share * 100) + '%"></i><b style="left:' + Math.round(goal * 100) + '%"></b></div><div class="muted small">Objectif : moins de ' + Math.round(goal * 100) + " % du CA · " +
      (share > goal ? "≈ " + (needed < 1 ? needed.toFixed(1).replace(".", ",") : Math.round(needed)) + " course(s) / jour hors " + esc(top.key) + " pour l'atteindre" : "bravo") + "</div></div>" +
    '<div class="card span2"><h2>CA par donneur d\'ordre · depuis janvier</h2>' + barRows(cl.slice(0, 8), M.caYtd) +
      '<p class="muted small" style="margin:8px 0 0">Nouveaux clients : appliquez le libellé Gmail <b>clients</b> à leurs commandes (PDF) ; Soriya les ajoute ici automatiquement.</p></div></div>' +
    '<div class="card" style="margin-top:16px"><h2>Prospection <a class="more" href="' + esc(P.url || "#") + '">Modifier la liste (Google Sheet) ↗</a></h2>' +
      (P.error ? '<div class="empty">' + esc(P.error) + "</div>" : '<div class="kanban">' + cols.map(c => {
        const items = P.list.filter(p => p.status === c).sort((a, b) => (ord[a.potential] ?? 9) - (ord[b.potential] ?? 9));
        return '<div class="col"><h3>' + c + "<span>" + items.length + "</span></h3>" + items.map(p =>
          '<div class="pcard">' + (p.link ? '<a href="' + esc(p.link) + '">' + esc(p.name) + "</a>" : "<b>" + esc(p.name) + "</b>") +
          ' <span class="badge ' + esc((p.potential || "").toLowerCase()) + '">' + esc(p.potential || "?") + "</span><p>" + esc(p.why) + "</p>" +
          (p.next ? '<span class="muted">➜ ' + esc(p.next) + (p.date ? " · " + esc(p.date) : "") + "</span>" : "") + "</div>").join("") + "</div>"; }).join("") + "</div>") +
    "</div>";
}

function pageActivity(el) {
  el.innerHTML = '<div class="grid g2">' + DATA.activities.map(a => {
    const type = a.id === "Mailing" ? "conf" : "ldv", docs = DATA.docs.filter(x => x.type === type);
    let pill = '<span class="pill ok">● En service</span>';
    if (a.lastErrors) pill = '<span class="pill bad">▲ ' + a.lastErrors + " erreur(s)</span>";
    else if (a.lastStart && a.lastRun && a.lastStart !== a.lastRun) pill = '<span class="pill warn">● Passage en cours</span>';
    return '<div class="card"><h2><span class="dot" style="background:var(--s-' + type + ')"></span>' + esc(a.label) + ' <span style="margin-left:auto">' + pill + "</span></h2>" +
      '<p class="muted small" style="margin:-6px 0 12px">' + esc(a.source) + "</p>" +
      '<div class="grid g4">' + tile("Archivés", String(docs.filter(x => statusKind(x.status) === "ok").length)) + tile("À vérifier", String(docs.filter(x => statusKind(x.status) !== "ok").length)) +
      tile("En attente", a.pending == null ? "—" : String(a.pending)) + tile("Ce mois", String(docs.filter(x => (x.date || "").slice(0, 7) === M.thisMonth).length)) + "</div>" +
      '<p class="small" style="margin:12px 0 0">Dernier passage : <b>' + esc(a.lastRun || "—") + "</b>" + (a.folderUrl ? ' · <a href="' + esc(a.folderUrl) + '">Dossier Drive ↗</a>' : "") + (a.journalUrl ? ' · <a href="' + esc(a.journalUrl) + '">Journal ↗</a>' : "") + "</p>" +
      (a.lastError ? '<p class="pill bad" style="white-space:normal;margin-top:8px">Dernière erreur : ' + esc(a.lastError) + "</p>" : "") + "</div>";
  }).join("") + "</div>" +
  '<div class="card" style="margin-top:16px"><h2>Documents à vérifier <span class="muted small" style="font-weight:400">lecture incertaine, listings, factures, documents non lus</span></h2><div id="tv"></div></div>';
  dataTable(document.getElementById("tv"), M.toCheck, [
    { key: "date", label: "Date", html: x => fmtDate(x.date) },
    { key: "type", label: "Type", html: x => '<span class="dot" style="background:var(--s-' + x.type + ')"></span> ' + (x.type === "conf" ? "Confirmation" : "Lettre de voiture") },
    { key: "name", label: "Fichier", html: x => esc(short(x.name, 48)) },
    { key: "status", label: "Motif", html: x => '<span class="small">' + esc(short(x.status, 110)) + "</span>" },
  ], { state: (view.tv = view.tv || {}), sort: "date", onRow: openDoc });
}

/* ---------- Démarrage ---------- */
document.getElementById("refresh").onclick = load;
document.getElementById("menuBtn").onclick = () => document.getElementById("side").classList.toggle("open");
document.getElementById("brandLogo").innerHTML = GFD_LOGO;
/* ---------- Chat Soriya (panneau de droite ; bulle flottante sur écran étroit) ---------- */
const CHAT = { history: [] };
["chatLogo", "fabLogo"].forEach(id => { document.getElementById(id).innerHTML = GFD_LOGO; });
const chatFmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\n)[•\-\*] (.+)/g, "$1<li>$2</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\n?<li>)/g, "<ul>$1</ul>").replace(/\n/g, "<br>").replace(/<\/li><br>/g, "</li>").replace(/<br><ul>/g, "<ul>");
function chatAdd(role, html, cls) {
  const box = document.getElementById("chatMsgs"), d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot") + (cls ? " " + cls : ""); d.innerHTML = html; box.appendChild(d); box.scrollTop = box.scrollHeight; return d;
}
// Résumé chiffré des données pour Soriya (ce que le site affiche).
function chatContext() {
  const sum = a => Math.round(a.reduce((t, x) => t + (x.amount || 0), 0) * 100) / 100;
  const months = Object.keys(M.byMonth).sort().slice(-12);
  const by = (list, key) => { const o = {}; list.forEach(x => { const k = key(x) || "non identifié"; (o[k] = o[k] || { ca: 0, n: 0 }); o[k].ca += x.amount; o[k].n++; });
    Object.values(o).forEach(v => { v.ca = Math.round(v.ca * 100) / 100; }); return o; };
  const recent = months.slice(-4), today = isoDay(new Date()), tomorrow = addDays(today, 1);
  const plan = DATA.planning || {};
  const dayList = d => M.conf.filter(x => x.status.indexOf("Archivé") === 0 && !x.dupOf && x.amountConf > 0 && (x.date || "").slice(0, 10) === d)
    .map(x => ({ n: x.number, trajet: city(x.from) + " → " + city(x.to), montant: x.amountConf, chauffeur: x.ldv ? x.ldv.driver : (plan[digits(x.number)] || {}).driver || "non affecté", lettre: !!x.ldv }));
  const F = DATA.factures || { list: [] }, R = DATA.releves || { list: [] }, D = (DATA.depenses || { list: [] }).list;
  const fuel = {}; D.filter(x => /ticket/i.test(x.kind)).forEach(x => { const k = (x.date || "").slice(0, 7) + " " + (x.driver || "?"); fuel[k] = Math.round(((fuel[k] || 0) + x.ttc) * 100) / 100; });
  return {
    aujourdhui: today, page: (location.hash.replace(/^#\/?/, "") || "tableau-de-bord"),
    ca: { mois_en_cours: M.caMtd, projection_fin_de_mois: Math.round(M.projection), annee: M.caYtd, courses_mois: M.mtd.length },
    ca_par_mois: months.map(m => ({ mois: m, ca: Math.round(M.byMonth[m].ca * 100) / 100, courses: M.byMonth[m].n })),
    ca_par_chauffeur_par_mois: recent.map(m => ({ mois: m, chauffeurs: by(M.sales.filter(x => x.date.slice(0, 7) === m), x => x.driver) })),
    ca_par_client_3_mois: by(M.sales.filter(x => x.date.slice(0, 7) >= months.slice(-3)[0]), x => x.client),
    ca_par_prestation_mois: by(M.mtd, x => String(x.services || "").split(/\s\d/)[0].trim()),
    planning: { aujourdhui: dayList(today), demain: dayList(tomorrow) },
    courses_sans_lettre_mois: M.noLdv.map(x => ({ n: x.number, date: x.date.slice(0, 10), trajet: city(x.from) + " → " + city(x.to), montant: x.amount })),
    lettres_sans_confirmation: M.orphanLdv.slice(0, 40).map(x => ({ n: x.number, date: (x.date || "").slice(0, 10), chauffeur: x.driver })),
    ajustements_ca: M.conf.filter(x => x.adj).slice(-30).map(x => ({ n: x.number, motif: x.adj })),
    factures: F.list.map(f => ({ n: f.number, mois: f.month, ht: f.ht, ttc: f.ttc, emise: f.issued, echeance: f.due })),
    releves_ecotime: R.list.filter(r => r.current).map(r => ({ mois: r.month, total_ht: r.total, ordres: r.orders })),
    carburant_ttc_par_mois_et_chauffeur: fuel,
    incidents: (DATA.incidents || []).slice(-20),
    relances_ecotime: Object.keys(DATA.relances || {}).slice(-20).map(n => Object.assign({ n: n }, DATA.relances[n])),
    activite_soriya: DATA.activities.map(a => ({ activite: a.id, dernier_passage: a.lastRun, erreurs: a.lastErrors })),
  };
}
function chatSend(q) {
  q = String(q || "").trim(); if (!q || CHAT.busy || !M) return;
  CHAT.busy = true; document.getElementById("chatChips").innerHTML = "";
  chatAdd("user", esc(q)); const wait = chatAdd("bot", '<span class="typing"><i></i><i></i><i></i></span>');
  google.script.run.withSuccessHandler(a => { CHAT.busy = false; wait.innerHTML = chatFmt(a); CHAT.history.push({ role: "user", text: q }, { role: "assistant", text: a });
      document.getElementById("chatMsgs").scrollTop = 1e9; })
    .withFailureHandler(err => { CHAT.busy = false; wait.classList.add("err"); wait.textContent = err.message +
      (/autoris|scope|permission/i.test(err.message) ? " — rechargez la page et acceptez l'autorisation demandée." : ""); })
    .soriyaWebChat(q, CHAT.history.slice(-16), chatContext(), KEY);
}
function chatInit() {
  if (CHAT.ready) return; CHAT.ready = true;
  chatAdd("bot", "Bonjour 👋 Je suis <b>Soriya</b>. Posez-moi une question sur vos courses, votre chiffre d'affaires, le planning ou vos factures.");
  document.getElementById("chatChips").innerHTML = ["CA de ce mois ?", "Courses sans lettre de voiture ?", "Qui a fait le plus de courses ce mois ?", "Factures à encaisser ?", "Planning de demain ?"]
    .map(t => '<button type="button">' + esc(t) + "</button>").join("");
  document.querySelectorAll("#chatChips button").forEach(b => b.onclick = () => chatSend(b.textContent));
}
document.getElementById("chatForm").onsubmit = e => { e.preventDefault(); const t = document.getElementById("chatQ"); chatSend(t.value); t.value = ""; t.style.height = ""; };
document.getElementById("chatQ").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chatForm").requestSubmit(); } });
document.getElementById("chatQ").addEventListener("input", e => { e.target.style.height = ""; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; });
document.getElementById("chatFab").onclick = () => { document.getElementById("rail").classList.add("open"); chatInit(); setTimeout(() => document.getElementById("chatQ").focus(), 50); };
document.getElementById("chatClose").onclick = () => document.getElementById("rail").classList.remove("open");
// Chiffres du jour sur la scène animée.
function sceneStats() {
  if (!M) return; const t = isoDay(new Date());
  const day = M.conf.filter(x => x.status.indexOf("Archivé") === 0 && !x.dupOf && x.amountConf > 0 && (x.date || "").slice(0, 10) === t);
  document.getElementById("scToday").textContent = day.length + " course" + (day.length > 1 ? "s" : "");
  document.getElementById("scLdv").textContent = day.filter(x => x.ldv).length + " / " + day.length;
  document.getElementById("scCa").textContent = EUR.format(M.caMtd);
  if (window.matchMedia("(min-width: 1600px)").matches) chatInit();
}
// Menu « Documents & plus » : se ferme au clic ailleurs ou sur un lien.
document.addEventListener("click", e => { const mm = document.querySelector("#nav .more-menu");
  if (mm && mm.open && !e.target.closest("#tabMore") && (!mm.contains(e.target) || e.target.closest("a"))) mm.open = false; });
// Textes d'aide repliés sur une ligne : un clic les déplie.
document.addEventListener("click", e => { const t = e.target.closest && e.target.closest("#page > p.muted.small, .toolbar > span.muted.small"); if (t) t.classList.toggle("open"); });
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (DATA && !location.hash.replace(/^#\/?/, "")) route(); }, 200); });
load();
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
// Sur téléphone, un onglet en arrière-plan est mis en pause : on recharge dès qu'on revient sur la page.
const reloadIfStale = () => { if (!document.hidden && Date.now() - loadedAt > 60 * 1000) load(); };
document.addEventListener("visibilitychange", reloadIfStale);
window.addEventListener("focus", reloadIfStale);
window.addEventListener("pageshow", e => { if (e.persisted) load(); });
</script>
