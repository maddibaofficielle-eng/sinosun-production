<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_blank">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    /* Charte GFD Logistic : bleu marine, blanc, rouge bordeaux */
    --navy: #0f1f4b; --navy-2: #1b3170; --bordeaux: #8c1c2f; --bordeaux-2: #a8263b; --bordeaux-soft: #f8e8eb;
    --bg: #ffffff; --surface: #f3f5fb; --surface-2: #ffffff; --line: #e3e7f1; --grid: #e6eaf3; --tint: #eef1fa; --tint-2: #fbeef0;
    --ink: #0f1b3d; --ink-2: #4b5572; --ink-3: #7d859b;
    --accent: #1b3170; --accent-ink: #ffffff; --accent-soft: #e9eef8;
    --s-conf: #1f3d8f; --s-ldv: #8c1c2f; --c1: #1f3d8f; --c2: #8c1c2f; --c3: #1a8a64;
    --side: #0f1f4b; --side-ink: #c9d2ea; --side-act: rgba(255,255,255,.10);
    --ca-from: #1b3170; --ca-to: #0b1636;
    --m1: #c7d3ef; --m2: #9cb0e0; --m3: #6a86cc; --m4: #3a5bb0; --m5: #1b3170; --m-old: #cdd2de;
    --good: #16794a; --good-bg: #e4f4ec; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b3202f; --bad-bg: #fbe8ea;
    --shadow: 0 1px 2px rgba(15,27,61,.05), 0 6px 20px rgba(15,27,61,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --navy: #0b1530; --navy-2: #2b4590; --bordeaux: #e0566b; --bordeaux-2: #ec7183; --bordeaux-soft: #3a1820;
      --bg: #070c1c; --surface: #111a33; --surface-2: #16213f; --line: #25325a; --grid: #1c2847; --tint: #142045; --tint-2: #2a1520;
      --ink: #f1f4fb; --ink-2: #b4bcd4; --ink-3: #8790ab;
      --accent: #8aa6ff; --accent-ink: #0b1530; --accent-soft: #1a2750;
      --s-conf: #8aa6ff; --s-ldv: #e0566b; --c1: #8aa6ff; --c2: #e0566b; --c3: #4cc596;
      --side: #0b1530; --side-ink: #b9c4e2; --side-act: rgba(255,255,255,.08);
      --ca-from: #22397a; --ca-to: #0f1d45;
      --m1: #1a2b5c; --m2: #26408a; --m3: #3b5cb8; --m4: #6585dc; --m5: #a9bdf5; --m-old: #3a4360;
      --good: #5fd39b; --good-bg: #12301f; --warn: #f0c060; --warn-bg: #362a0f; --bad: #ff8a95; --bad-bg: #3a1720;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); }
  button, select, input {
    font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; min-height: 40px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--ink-3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Structure de l'application ---------- */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); color: var(--side-ink); padding: 18px 12px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: #fff; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #3987e5, #eb6834);
    display: grid; place-items: center; font-weight: 800; }
  .brand b { display: block; font-size: 17px; }
  .brand small { color: var(--side-ink); font-size: 12px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--side-ink);
    text-decoration: none; font-size: 14px; font-weight: 500; }
  .nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav a.on { background: var(--side-act); color: #fff; }
  .nav .ico { width: 20px; text-align: center; }
  .nav .cnt { margin-left: auto; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.14); border-radius: 999px; padding: 1px 7px; }
  .nav .cnt.alert { background: #c5221f; color: #fff; }
  .nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--side-ink); opacity: .6; padding: 14px 12px 4px; }
  .nav details summary { list-style: none; cursor: pointer; }
  .nav details summary::-webkit-details-marker { display: none; }
  .nav details[open] .grp::after { content: " ▴"; } .nav details:not([open]) .grp::after { content: " ▾"; }
  details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-top: 16px; }
  details.fold > summary { cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--ink-3); transition: transform .15s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary .more { margin-left: auto; font-weight: 400; font-size: 13px; }
  details.fold > .fold-body { padding: 0 16px 16px; }
  details.fold > .fold-body > .card, details.fold .totals .card { box-shadow: none; }
  .todo-list li b { font-weight: 600; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; }
  label.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .ans { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .ans select { font-size: 12px; padding: 4px 6px; max-width: 170px; }
  /* Tableau de bord */
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 10px; min-width: 0; position: relative; }
  .kpi .lbl { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .kpi .lbl i { font-style: normal; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); font-size: 12px; }
  .kpi b { display: block; font-size: 24px; line-height: 1.2; margin: 6px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kpi em { font-style: normal; font-size: 12px; font-weight: 600; }
  .kpi.hero { background: linear-gradient(135deg, var(--ca-from), var(--ca-to)); color: #fff; border: 0; }
  .kpi.hero .lbl { color: rgba(255,255,255,.8); } .kpi.hero .lbl i { background: rgba(255,255,255,.15); }
  .kpi.hero em, .kpi.hero em.muted, .kpi.hero em.up, .kpi.hero em.down { color: rgba(255,255,255,.9) !important; }
  .kpi svg.spark { display: block; width: 100%; height: 28px; margin-top: 4px; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--grid); cursor: pointer; }
  .feed li:last-child { border-bottom: 0; }
  .feed .d { font-size: 12px; color: var(--ink-2); line-height: 1.25; }
  .feed .d b { display: block; font-size: 15px; color: var(--ink); }
  .feed .r { min-width: 0; } .feed .r div { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed .r span { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid.al-start { align-items: start; }
  .feed .a { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .feed .a small { display: block; font-weight: 500; font-size: 11px; }
  .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; margin: 6px 0 12px; }
  .stack i { display: block; height: 100%; }
  .legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 13px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .legend .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .legend .p { color: var(--ink-2); font-size: 12px; min-width: 38px; text-align: right; }
  .minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .minis div { background: var(--bg); border-radius: 10px; padding: 8px 10px; } .minis span { font-size: 11px; color: var(--ink-2); display: block; }
  .minis b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .docbars { display: grid; gap: 8px; }
  .docbars .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 12px; }
  .docbars .track { display: flex; gap: 2px; height: 10px; } .docbars .track i { display: block; height: 100%; border-radius: 3px; }
  .docbars .row .n { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .status-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .status-row:last-child { border-bottom: 0; } .status-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
  .status-row .dot.bad { background: var(--bad); } .status-row span { color: var(--ink-2); margin-left: auto; font-size: 12px; text-align: right; }
  @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi b { font-size: 20px; } }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--side-ink); padding: 8px; line-height: 1.5; }
  .main { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 12px 24px; }
  .top h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .top small { color: var(--ink-2); font-size: 12px; display: block; font-weight: 400; }
  .top .sp { flex: 1; }
  .menu-btn { display: none; }
  .page { padding: 20px 24px 48px; max-width: 1400px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .more { margin-left: auto; font-size: 13px; font-weight: 500; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  /* Tuiles KPI */
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  .tile span { font-size: 12px; color: var(--ink-2); display: block; }
  .tile b { display: block; font-size: 26px; line-height: 1.15; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tile em { font-style: normal; font-size: 12px; font-weight: 600; }
  .tile.hero { background: linear-gradient(135deg, var(--ca-from), var(--ca-to)); color: #fff; border: 0; }
  .tile.hero span { color: rgba(255,255,255,.82); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .tile.hero .up { color: #bff0cd; } .tile.hero .down { color: #ffd0cc; }
  .tile.hero .muted { color: rgba(255,255,255,.8) !important; }
  td.nw { white-space: nowrap; }
  #refresh { white-space: nowrap; }
  @media (max-width: 520px) { #refresh .lbl { display: none; } }

  /* Pastilles */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { color: var(--good); background: var(--good-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .pill.info { color: var(--accent); background: var(--accent-soft); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .badge.fort { background: var(--good-bg); color: var(--good); }
  .badge.moyen { background: var(--warn-bg); color: var(--warn); }
  .badge.faible { background: var(--grid); color: var(--ink-2); }

  /* Planning / dispatch : une colonne par chauffeur */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; align-items: start; }
  .lane { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
  .lane.todo { border-color: var(--warn); }
  .lane h3 { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; font-size: 15px; }
  .lane h3 .meta { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--ink-2); }
  .lane .empty-lane { color: var(--ink-3); font-size: 13px; padding: 8px 2px; }
  .job { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); margin-bottom: 8px; cursor: pointer; }
  .job:hover { border-color: var(--ink-3); }
  .job .r1 { display: flex; gap: 8px; align-items: baseline; }
  .job .t { font-weight: 700; font-variant-numeric: tabular-nums; }
  .job .n { margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .job .rt { margin: 3px 0 6px; font-size: 14px; }
  .job .ft { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .job select { min-height: 32px; padding: 3px 8px; font-size: 13px; margin-left: auto; max-width: 100%; }
  .job.off { opacity: .6; }
  .daynav { display: inline-flex; gap: 6px; align-items: center; }
  .daynav b { font-size: 16px; margin: 0 6px; }

  /* Préparation de facture (aperçu imprimable) */
  .inv { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 14px; padding: 32px 36px; max-width: 900px; }
  .inv h1 { font-size: 22px; margin: 0; letter-spacing: .02em; color: #0f1f4b; }
  .inv th { color: #0f1f4b; } .inv .tot .big { color: #0f1f4b; }
  .inv .hd { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .inv .hd .to { text-align: right; }
  .inv .meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 20px; font-size: 13px; }
  .inv .meta span { display: block; color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .inv table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .inv th { text-align: left; border-bottom: 2px solid #111; padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .inv td { border-bottom: 1px solid #e3e3e3; padding: 6px 8px; }
  .inv .num, .inv th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .inv .tot { margin: 16px 0 0 auto; width: min(320px, 100%); font-size: 14px; }
  .inv .tot div { display: flex; justify-content: space-between; padding: 4px 8px; }
  .inv .tot .big { border-top: 2px solid #111; font-weight: 800; font-size: 16px; margin-top: 4px; padding-top: 8px; }
  .inv .foot { margin-top: 28px; font-size: 11px; color: #666; }
  .inv .ponly { display: none; }
  .inv input.inl { border: 1px dashed #bbb; background: #fffbe6; color: #111; min-height: 0; padding: 2px 6px; width: 9em; }
  @media (max-width: 640px) { .inv { padding: 18px 14px; } .inv .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media print {
    body { background: #fff !important; }
    body.printing .side, body.printing .top, body.printing .noprint, body.printing #drawer, body.printing #drawerBg { display: none !important; }
    body.printing .app { display: block; } body.printing .page { padding: 0; max-width: none; }
    body.printing .inv { border: 0; padding: 0; max-width: none; }
    body.printing .inv input.inl, body.printing .inv .scr { display: none; } body.printing .inv .ponly { display: inline; }
  }

  /* Barre d'outils + tableau */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1 1 240px; }
  .toolbar .count { color: var(--ink-2); font-size: 13px; margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--surface-2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--ink-2); font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  th[data-s] { cursor: pointer; }
  th[data-s]:hover { color: var(--ink); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface-2); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .route b { font-weight: 500; }
  tbody tr:nth-child(even):not(.grp) td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  tr.grp td { background: var(--accent-soft) !important; color: var(--ink); font-weight: 700; font-size: 13px; cursor: default; padding: 8px 12px; }
  tr.grp td span { font-weight: 500; color: var(--ink-2); margin-left: 8px; }
  tfoot td { white-space: nowrap; position: sticky; bottom: 0; background: var(--surface); border-top: 2px solid var(--line); font-weight: 700; padding: 12px; }
  .totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  .totals .card { padding: 12px 14px; }
  .totals table { font-size: 13px; }
  .totals th, .totals td { padding: 7px 10px; }
  .totals tbody tr:hover td { background: var(--accent-soft); }
  .totals tr.on td { background: var(--accent-soft); font-weight: 700; }
  .totals tfoot td { position: static; }
  .totals .sub, .card .sub { font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .card tr.on td { background: var(--accent-soft); }
  .totals td.muted { color: var(--ink-3); }
  @media (max-width: 860px) { .totals { grid-template-columns: 1fr; } }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 12px; }
  .empty { padding: 32px; text-align: center; color: var(--ink-2); }

  /* Listes à barres (chauffeurs, clients) */
  .bars { display: grid; gap: 2px; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
  .bar-row:last-child { border-bottom: 0; }
  .bar-row .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row small { color: var(--ink-2); font-size: 12px; grid-column: 1 / -1; }
  .bar-row .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .bar-row .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .bar-row.none .bar i { background: var(--ink-3); }

  /* Graphiques */
  .chart { width: 100%; height: 220px; position: relative; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 3; }
  .donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .donut { width: 200px; height: 200px; position: relative; flex: none; }
  .donut svg { width: 100%; height: 100%; display: block; }
  .dleg { flex: 1 1 180px; display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .dleg li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 14px; border-radius: 6px; padding: 3px 4px; }

  /* Alertes / conseils */
  .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  .tips b { display: block; }
  .tips span, .tips a { font-size: 13px; }

  /* Chauffeurs */
  .drivers { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .drv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }

  .drv-stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }

  /* Prospection : tableau Kanban */
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 120px; }
  .col h3 { font-size: 13px; margin: 2px 4px 10px; display: flex; justify-content: space-between; color: var(--ink-2); }
  .pcard { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .pcard a { font-weight: 600; color: var(--ink); text-decoration: none; font-size: 14px; }
  .pcard a:hover { text-decoration: underline; }
  .pcard p { margin: 6px 0; color: var(--ink-2); }
  .meter { position: relative; height: 12px; border-radius: 6px; background: var(--grid); margin: 14px 0 6px; }
  .meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); }
  .meter > b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }

  /* Panneau de détail */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); z-index: 21;
    box-shadow: -8px 0 32px rgba(0,0,0,.2); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .drawer header h3 { margin: 0; font-size: 17px; flex: 1; }
  .drawer .body { padding: 16px 20px; overflow: auto; }
  .kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .link-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 14px 0; background: var(--surface-2); }

  @media (max-width: 1100px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 30; width: 260px; left: 0; transform: translateX(-100%); transition: transform .2s ease; }
    .side.open { transform: none; }
    .menu-btn { display: inline-block; }
    .g2, .g3 { grid-template-columns: 1fr; }
    .span2 { grid-column: auto; }
    .page, .top { padding-left: 16px; padding-right: 16px; }
    .hide-sm { display: none; }
    .kv { grid-template-columns: 120px minmax(0, 1fr); }
  }
  @media (max-width: 520px) { .g6, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile b { font-size: 21px; } }

  /* ================= Thème GFD — esprit Stuart : blanc, grands titres, blocs pastel, pilules ================= */
  body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; background: var(--bg); }
  a { color: var(--navy-2); text-decoration-thickness: 1.5px; text-underline-offset: 3px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { a { color: var(--accent); } }
  button, select, input { border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); padding: 9px 18px; min-height: 42px; }
  textarea { border-radius: 16px; }
  button { font-weight: 700; transition: background .15s, border-color .15s, color .15s, transform .1s; }
  button:hover { border-color: var(--navy-2); } button:active { transform: scale(.98); }
  #bPrint, button.primary { background: var(--bordeaux) !important; border-color: var(--bordeaux) !important; color: #fff !important; }

  /* Barre de navigation blanche en haut */
  .app { display: block; }
  .side { position: sticky; top: 0; z-index: 30; height: auto; flex-direction: row; align-items: center; gap: 28px;
    background: var(--bg); color: var(--ink); padding: 12px 40px; border-bottom: 1px solid var(--line); }
  .brand { padding: 0; gap: 12px; color: var(--ink); flex: none; }
  .brand .logo { width: 44px; height: 44px; border-radius: 50%; background: #fff; padding: 0; box-shadow: none; }
  .brand .logo svg { width: 100%; height: 100%; display: block; }
  .brand b { font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: var(--navy); }

  .brand small { color: var(--ink-3); font-size: 12px; }
  .nav { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .nav a { color: var(--ink-2); padding: 9px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 600; gap: 8px; white-space: nowrap; }
  .nav a:hover { background: var(--tint); color: var(--ink); }
  .nav a.on { background: var(--navy); color: #fff; }
  @media (prefers-color-scheme: dark) { .nav a.on { background: var(--accent); color: var(--accent-ink); } }
  .nav a.on::before { display: none; }
  .nav .ico { display: none; }
  .nav > .grp { display: none; }
  .nav details { position: relative; }
  .nav details > summary { list-style: none; cursor: pointer; padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
  .nav details > summary:hover, .nav details[open] > summary { background: var(--tint); color: var(--ink); }
  .nav details > summary .grp { all: unset; }
  .nav details[open] .grp::after, .nav details:not([open]) .grp::after { content: ""; }
  .nav details > summary::after { content: " ▾"; font-size: 11px; }
  .nav .menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 260px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 20px; padding: 10px; box-shadow: 0 18px 40px rgba(15,27,61,.14); display: grid; gap: 2px; }
  .nav .menu .grp { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 10px 12px 4px; opacity: 1; }
  .nav .menu a { border-radius: 12px; }
  .nav .menu .ico { display: inline-grid; width: 18px; height: 18px; color: var(--ink-3); } .nav .menu .ico svg { width: 18px; height: 18px; }
  .nav .menu a.on .ico { color: #fff; }
  .side-foot { display: none; }
  .nav .cnt.alert { background: var(--bordeaux); color: #fff; }

  /* En-tête de page : très grand titre */
  .top { position: static; background: none; backdrop-filter: none; border: 0; padding: 36px 40px 8px; max-width: 1480px; }
  .top h1 { font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .top h1 { color: #fff; } }
  .top small { font-size: 13px; color: var(--ink-3); margin-top: 8px; letter-spacing: 0; font-weight: 500; }
  #refresh { background: var(--navy); color: #fff; border-color: var(--navy); }
  .page { padding: 20px 40px 72px; max-width: 1480px; }

  /* Blocs pastel très arrondis, sans ombre */
  .card, .kpi, .tile, details.fold, .lane, .drv-card, .col { background: var(--surface); border: 0; box-shadow: none; border-radius: 24px; }
  .card { padding: 22px; }
  .card h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.015em; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .card h2 { color: #fff; } }
  .tile, .kpi { padding: 20px 22px; }
  .tile span, .kpi .lbl { font-weight: 600; color: var(--ink-2); font-size: 13px; }
  .tile b, .kpi b { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .tile b, .kpi b { color: #fff; } }
  .tile.hero, .kpi.hero { background: var(--navy); color: #fff; }
  .tile.hero b, .kpi.hero b { color: #fff; }
  .tile.hero::after, .kpi.hero::after { display: none; }
  .tile.hero span, .kpi.hero .lbl { color: rgba(255,255,255,.75); }
  .grid > .tile:nth-child(2), .kpis > .kpi:nth-child(2) { background: var(--tint-2); }
  .kpi .lbl i { background: #fff; color: var(--navy-2); width: 26px; height: 26px; border-radius: 50%; } .kpi .lbl i svg { width: 14px; height: 14px; }
  .kpi.hero .lbl i { background: rgba(255,255,255,.14); color: #fff; }
  @media (prefers-color-scheme: dark) { .kpi .lbl i { background: var(--surface-2); } }
  .table-wrap { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 24px; box-shadow: none; }
  th { background: var(--surface-2); font-size: 11px; font-weight: 700; letter-spacing: .07em; color: var(--ink-3); }
  th, td { padding: 13px 14px; }
  tbody tr:hover td { background: var(--tint); }
  tbody tr:nth-child(even):not(.grp) td { background: transparent; }
  tr.grp td { background: var(--tint) !important; }
  .pill { border-radius: 999px; font-weight: 700; padding: 3px 11px; }
  .pill.info { color: var(--navy-2); background: var(--tint); }
  @media (prefers-color-scheme: dark) { .pill.info { color: var(--accent); } }
  .seg { border-radius: 999px; padding: 4px; background: var(--surface); border: 0; gap: 2px; }
  .seg button { border: 0; border-radius: 999px; min-height: 36px; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .lane { padding: 16px; } .lane.todo { background: var(--tint-2); border: 0; }
  .job { border: 0; border-radius: 18px; background: var(--surface-2); padding: 14px; }
  .job .t { font-weight: 800; font-size: 17px; }
  details.fold > summary { font-weight: 800; font-size: 16px; padding: 18px 22px; }
  .bar-row .bar i, .meter > i { background: var(--navy-2); }
  @media (prefers-color-scheme: dark) { .bar-row .bar i, .meter > i { background: var(--accent); } }
  .avatar { background: var(--bordeaux); }
  .tips .ic { border-radius: 50%; }
  .minis div { background: var(--surface-2); border-radius: 14px; }
  .inv { border-radius: 24px; border: 1.5px solid var(--line); box-shadow: none; }
  .drawer { border-radius: 24px 0 0 24px; }
  /* Textes d'aide : une ligne, le reste au clic */
  #page > p.muted.small, .toolbar > span.muted.small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  #page > p.muted.small.open, .toolbar > span.muted.small.open { -webkit-line-clamp: unset; display: block; }
  #page > p.muted.small::before, .toolbar > span.muted.small::before { content: "ⓘ "; color: var(--bordeaux); font-weight: 800; }

  /* Mobile : logo en haut, onglets en bas, « Plus » en panneau */
  .tabbar { display: none; }
  @media (max-width: 1100px) { .side { padding: 10px 20px; gap: 16px; } .nav a, .nav details > summary { padding: 8px 10px; font-size: 13.5px; } .brand small { display: none; } }
  @media (max-width: 860px) {
    .side { padding: 10px 16px; transform: none !important; position: sticky; width: auto; }
    .nav { display: none; }
    .side.open .nav { display: grid; position: fixed; left: 8px; right: 8px; bottom: 76px; max-height: 70vh; overflow: auto; background: var(--surface-2);
      border-radius: 24px; padding: 12px; box-shadow: 0 -10px 40px rgba(15,27,61,.25); gap: 2px; z-index: 40; }
    .side.open .nav details > summary { display: none; }
    .side.open .nav .menu { position: static; box-shadow: none; border: 0; padding: 0; min-width: 0; }
    .side.open .nav .ico { display: inline-grid; width: 18px; height: 18px; } .side.open .nav .ico svg { width: 18px; height: 18px; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
      background: var(--bg); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
    .tabbar a, .tabbar button { display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink-3); text-decoration: none;
      background: none; border: 0; min-height: 50px; padding: 4px 0; border-radius: 14px; }
    .tabbar svg { width: 22px; height: 22px; }
    .tabbar .on { color: var(--bordeaux); }
    .menu-btn { display: none !important; }
    .top { padding: 22px 16px 4px; } .top h1 { font-size: 30px; }
    .page { padding: 14px 16px 104px; }
    .tile b, .kpi b { font-size: 26px; }
  }

  /* ================= Panneau de droite : animation + chat Soriya ================= */
  .rail { display: none; }
  .chat-fab { position: fixed; right: 24px; bottom: 24px; z-index: 36; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border: 0;
    background: var(--bordeaux); color: #fff; border-radius: 999px; box-shadow: 0 10px 30px rgba(140,28,47,.35); font-weight: 800; min-height: 52px; }
  .chat-fab .lg { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: block; }
  .chat-fab .lg svg { width: 100%; height: 100%; display: block; }
  .chat-fab::after { content: ""; position: absolute; inset: -4px; border-radius: 999px; border: 2px solid var(--bordeaux); opacity: 0; animation: ring 2.8s ease-out infinite; }
  @keyframes ring { 0% { opacity: .6; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.12); } }
  .rail.open { display: flex; position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); height: min(640px, calc(100vh - 100px)); z-index: 45;
    flex-direction: column; filter: drop-shadow(0 20px 50px rgba(15,27,61,.3)); }
  .rail.open .scene { display: none; }
  .chat { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 24px; display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
  .chat-hd { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--navy); color: #fff; }
  .chat-hd .lg { width: 40px; height: 40px; border-radius: 50%; background: #fff; flex: none; } .chat-hd .lg svg { width: 100%; height: 100%; display: block; }
  .chat-hd b { display: block; font-size: 16px; } .chat-hd small { font-size: 12px; opacity: .8; display: flex; align-items: center; gap: 6px; }
  .chat-hd small i { width: 8px; height: 8px; border-radius: 50%; background: #5fd39b; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .chat-hd button { margin-left: auto; background: rgba(255,255,255,.12); color: #fff; border: 0; min-height: 36px; padding: 6px 12px; }
  .chat-msgs { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; animation: pop .25s ease-out; }
  .msg.me { align-self: flex-end; background: var(--navy); color: #fff; border-bottom-right-radius: 6px; }
  .msg.bot { align-self: flex-start; background: var(--surface); color: var(--ink); border-bottom-left-radius: 6px; }
  .msg.err { background: var(--bad-bg); color: var(--bad); }
  .msg ul { margin: 6px 0; padding-left: 18px; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .typing { display: inline-flex; gap: 4px; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: dot 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .chips button { font-size: 12.5px; min-height: 32px; padding: 5px 12px; background: var(--tint); border: 0; color: var(--navy-2); }
  @media (prefers-color-scheme: dark) { .chips button { color: var(--accent); } }
  .chat-in { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
  .chat-in textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 11px 16px; border-radius: 22px; font: inherit; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
  .chat-in button { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; background: var(--bordeaux); border: 0; color: #fff; font-size: 18px; flex: none; }
  /* Scène animée (camion GFD sur la route) */
  .scene { border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #13265c 0%, #0f1f4b 70%); position: relative; height: 240px; flex: none; color: #fff; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .road-dash { animation: road 1.2s linear infinite; }
  @keyframes road { to { stroke-dashoffset: -40; } }
  .scene .van { animation: bump .5s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes bump { to { transform: translateY(-1.5px); } }
  .scene .wheel { animation: spin .6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scene .city { animation: city 30s linear infinite; }
  @keyframes city { to { transform: translateX(-200px); } }
  .scene .cloud { animation: cloud 40s linear infinite; }
  @keyframes cloud { from { transform: translateX(420px); } to { transform: translateX(-160px); } }
  .scene .pin { animation: pin 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes pin { 50% { transform: translateY(-6px); } }
  .scene .stats { position: absolute; left: 18px; right: 18px; top: 16px; display: flex; justify-content: space-between; gap: 8px; }
  .scene .stats div { font-size: 11px; opacity: .8; } .scene .stats b { display: block; font-size: 22px; font-weight: 800; opacity: 1; letter-spacing: -0.02em; }
  @media (prefers-reduced-motion: reduce) { .scene *, .chat-fab::after, .chat-hd small i { animation: none !important; } }
  @media (min-width: 1600px) {
    .app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
    .side { grid-column: 1 / -1; }
    .rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 70px; height: calc(100vh - 70px); padding: 28px 28px 24px 0; }
    .chat-fab { display: none; }
    #chatClose { display: none; }
  }
  @media (max-width: 860px) {
    .chat-fab { bottom: 84px; right: 14px; padding: 6px; min-height: 0; } .chat-fab span { display: none; } .chat-fab .lg { width: 44px; height: 44px; }
    .rail.open { right: 0; left: 0; bottom: 0; top: 0; width: auto; height: auto; filter: none; z-index: 60; }
    .rail.open .chat { border-radius: 0; border: 0; }
  }
</style>

<body>
<div class="app">
  <header class="side" id="side" aria-label="Menu">
    <a class="brand" href="#/" target="_self" style="text-decoration:none"><div class="logo" id="brandLogo"></div><div><b>GFD Logistic</b><small>Soriya · gestion transport</small></div></a>
    <div class="nav" id="nav"></div>
    <div class="side-foot" id="sideFoot"></div>
  </header>
  <div class="main">
    <div class="top">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <h1 id="title">Tableau de bord<small id="sub">chargement…</small></h1>
      <span class="sp"></span>
      <button id="refresh" type="button" title="Actualiser">↻<span class="lbl"> Actualiser</span></button>
    </div>
    <div class="page" id="page"><div class="empty">Chargement des données…</div></div>
  </div>

<script>
const KEY = <?!= JSON.stringify(key) ?>;
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const DAYS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const EUR = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const EUR2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 });
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = d => /^\d{4}-\d{2}-\d{2}/.test(d || "") ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : esc(d || "—");
const monthLabel = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const pct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + " %";
const digits = s => String(s || "").replace(/\D/g, "");
const short = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const city = s => { const m = /(\d{5})\s+([^,(]+)/.exec(s || ""); return m ? m[2].trim() + " (" + m[1].slice(0, 2) + ")" : short((s || "").split(",")[0], 28); };
function normParty(p) {
  return (String(p || "").split(/,| - /)[0] || "").trim().toUpperCase().replace(/\s+(GROUP|GROUPE|SAS|SARL|SA)$/, "") || "NON RENSEIGNÉ";
}
const statusKind = s => s.indexOf("Archivé") === 0 && s.indexOf("impossible") < 0 ? "ok" : (s.indexOf("À vérifier") === 0 || s.indexOf("Mis de côté") === 0 ? "warn" : "bad");
const statusShort = s => (s || "—").split(" — ")[0];

let DATA = null, M = null;           // données brutes et dérivées
const view = {};                     // état des filtres par page

/* ---------- Chargement ---------- */
let loadedAt = 0, loading = false;
function load() {
  if (loading) return;
  loading = true; loadedAt = Date.now();
  document.getElementById("sub").textContent = "actualisation…";
  google.script.run
    .withSuccessHandler(d => { loading = false; DATA = d; M = derive(d); route(); })
    .withFailureHandler(e => { loading = false; document.getElementById("page").innerHTML = '<div class="empty">Impossible de charger les données : ' + esc(e.message) + "</div>"; })
    .soriyaWebData(KEY);
}

/** Calculs communs : courses facturées, rapprochement confirmation ↔ lettre de voiture, mois… */
function derive(d) {
  const conf = d.docs.filter(x => x.type === "conf"), ldv = d.docs.filter(x => x.type === "ldv");
  const ldvByNum = {}, confByNum = {};
  ldv.forEach(x => { const k = digits(x.number); if (k && !ldvByNum[k]) ldvByNum[k] = x; });
  conf.forEach(x => { const k = digits(x.number); if (k && !confByNum[k]) confByNum[k] = x; });
  conf.forEach(x => { x.ldv = ldvByNum[digits(x.number)] || null; x.client = normParty(x.party); if (!x.driver && x.ldv) x.driver = x.ldv.driver; });
  ldv.forEach(x => { x.conf = confByNum[digits(x.number)] || null; });
  // Planning : chauffeur affecté à la course (tant que la lettre de voiture, qui fait foi, n'est pas reçue).
  const plan = d.planning || {};
  conf.forEach(x => { x.plan = plan[digits(x.number)] || null; if (!x.ldv && !x.driver && x.plan) x.driver = x.plan.driver; });
  // Relevés Ecotime (versions en vigueur) : montant payé par n° d'ordre. Une course annulée est payée à demi-tarif
  // (GV zone 1 : 30 € au lieu de 60 €, Fourgon zone 1 : 20,50 € au lieu de 41 €…).
  // Tarifs d'annulation constatés sur les relevés et les factures (« Annulations Courses GV Z1 » à 30 €…).
  const CANCEL = { GV: [30, 35.5, 42.5], FG: [20.5], BKIDF: [12] };
  const R = d.releves || { list: [], lines: [] }, curKeys = {}, relMonths = {}, paid = {}, cancelLines = [];
  R.list.forEach(r => { if (r.current) { curKeys[r.key] = 1; if (r.sts.every(s => s.read)) relMonths[r.month] = 1; } });
  R.lines.forEach(l => { const k = digits(l.number); if (!curKeys[l.key] || !k) return;
    const p = (paid[k] = paid[k] || { total: 0, cancel: false }); p.total += l.amount;
    if ((CANCEL[String(l.service).toUpperCase()] || []).indexOf(l.amount) >= 0) { p.cancel = true; cancelLines.push(l); } });
  conf.forEach(x => { const p = paid[digits(x.number)];
    x.paid = p ? p.total : null; x.releveRead = !!relMonths[(x.date || "").slice(0, 7)]; x.cancelled = !!(p && p.cancel); });
  ldv.forEach(x => { const p = paid[digits(x.number)]; x.paid = p ? p.total : null; x.cancelled = !!(p && p.cancel); });
  cancelLines.forEach(l => { l.conf = confByNum[digits(l.number)] || null; l.ldv = ldvByNum[digits(l.number)] || null; });

  // ---- Cohérence du CA (x.amountConf = montant de la confirmation, x.amount = montant retenu, x.adj = pourquoi) ----
  const checks = d.checks || {};
  // Montant d'origine gardé à part : derive() peut être relancé (après une réponse) sans cumuler les ajustements.
  conf.forEach(x => { if (x.amountOrig === undefined) x.amountOrig = x.amount; x.amount = x.amountOrig; x.amountConf = x.amount; x.adj = ""; x.dupOf = null; x.replacedBy = null; });
  // 1. Confirmation renvoyée sous le même n° : seule la plus récente compte.
  const lastByNum = {};
  conf.forEach(x => { const k = digits(x.number); if (!k || x.status.indexOf("Archivé") !== 0 || !x.amount) return;
    const o = lastByNum[k]; if (!o || String(x.received) > String(o.received)) lastByNum[k] = x; });
  conf.forEach(x => { const k = digits(x.number), last = lastByNum[k];
    if (k && last && last !== x && x.amount) { x.adj = "Confirmation renvoyée : la version reçue le " + fmtDate(String(last.received).slice(0, 10)) + " fait foi"; x.dupOf = last; x.amount = 0; } });
  // 2. Même trajet, même jour : celle qui n'a ni lettre de voiture ni paiement au relevé, alors qu'une autre en a, a été remplacée.
  const place = s => { const m = /(\d{5})\s+([^,(]+)/.exec(String(s || "").toUpperCase()); return m ? m[1] + " " + m[2].trim() : String(s || "").toUpperCase().slice(0, 30); };
  const groups = {};
  conf.forEach(x => { if (!x.amount || !/^\d{4}-\d{2}-\d{2}/.test(x.date)) return;
    const g = x.date.slice(0, 10) + "|" + place(x.from) + "|" + place(x.to); (groups[g] = groups[g] || []).push(x); });
  Object.keys(groups).forEach(g => { const list = groups[g]; if (list.length < 2) return;
    const proven = list.filter(x => x.ldv || x.paid > 0); if (!proven.length) return;
    list.forEach(x => { if (x.ldv || x.paid > 0 || (checks[digits(x.number)] || {}).v === "OUI") return;
      x.replacedBy = proven[0]; x.amount = 0;
      x.adj = (x.releveRead ? "Remplacée" : "Doublon probable") + " par la confirmation n° " + proven[0].number + " (même trajet, même jour)"; }); });
  // 3. Réponse « course réalisée ? » = NON : seul ce qu'Ecotime a payé compte.
  conf.forEach(x => { const c = checks[digits(x.number)]; if (!c || c.v !== "NON" || !x.amount) return;
    x.adj = "Non réalisée — " + (c.motif || "motif non précisé"); x.amount = x.paid > 0 ? x.paid : 0; });
  // 4. Annulation constatée au relevé : CA = montant payé (½ tarif).
  conf.forEach(x => { if (x.cancelled && x.amount && x.paid > 0 && !x.adj && Math.abs(x.paid - x.amount) >= 0.01) {
    x.adj = "Annulée : payée " + EUR2.format(x.paid) + " au lieu de " + EUR2.format(x.amount); x.amount = x.paid; } });
  const sales = conf.filter(x => x.status.indexOf("Archivé") === 0 && x.amount > 0 && /^\d{4}-\d{2}-\d{2}/.test(x.date));
  const now = new Date(), thisMonth = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const prevD = new Date(now.getFullYear(), now.getMonth() - 1, 1), prevMonth = prevD.getFullYear() + "-" + String(prevD.getMonth() + 1).padStart(2, "0");
  const day = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const byMonth = {};
  sales.forEach(x => { const m = x.date.slice(0, 7); (byMonth[m] = byMonth[m] || { ca: 0, n: 0 }); byMonth[m].ca += x.amount; byMonth[m].n++; });
  const sum = a => a.reduce((t, x) => t + x.amount, 0);
  const mtd = sales.filter(x => x.date.slice(0, 7) === thisMonth);
  const ytd = sales.filter(x => x.date.slice(0, 4) === String(now.getFullYear()));
  const prevSame = sales.filter(x => x.date.slice(0, 7) === prevMonth && +x.date.slice(8, 10) <= day);
  const closed = Object.keys(byMonth).filter(m => m < thisMonth && byMonth[m].n >= 10).sort();
  const avg = ms => ms.length ? ms.reduce((t, m) => t + byMonth[m].ca, 0) / ms.length : 0;
  const caMtd = sum(mtd);
  const toCheck = d.docs.filter(x => statusKind(x.status) !== "ok");
  const noLdv = mtd.filter(x => !x.ldv && !x.cancelled); // une course annulée n'a pas de lettre de voiture
  return {
    conf, ldv, sales, byMonth, mtd, ytd, now, thisMonth, prevMonth, day, dim, closed,
    caMtd, caYtd: sum(ytd), caPrevSame: sum(prevSame), projection: day ? caMtd / day * dim : 0,
    avg3: avg(closed.slice(-3)), avgPrev3: avg(closed.slice(-6, -3)),
    toCheck, noLdv, cancelLines, relMonths, orphanLdv: ldv.filter(x => !x.conf && statusKind(x.status) === "ok"),
  };
}

/* ---------- Navigation ---------- */
// Icônes (traits, 24×24) et logo GFD Logistic.
const ICON_PATHS = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

  truck: '<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  swap: '<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',

  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2A6.5 6.5 0 0 1 21.5 20"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  pulse: '<path d="M3 12h4l2.5-6 5 12 2.5-6h4"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
};
const icon = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATHS[k] || "") + "</svg>";
// Logo GFD Logistic (compteur, aiguille et étoiles rouges) — dessiné en SVG pour rester net à toutes les tailles.
const GFD_LOGO = '<svg viewBox="0 0 100 100" role="img" aria-label="GFD Logistic"><circle cx="50" cy="50" r="48" fill="#fff"/><circle cx="50" cy="50" r="44" fill="none" stroke="#0f1f4b" stroke-width="3"/>' +
  '<path d="M27 44a24 24 0 0 1 46 0" fill="none" stroke="#0f1f4b" stroke-width="6" stroke-dasharray="3 2.2"/><path d="M50 44 61 18" stroke="#b3202f" stroke-width="3.2" stroke-linecap="round"/><circle cx="50" cy="44" r="3.2" fill="#0f1f4b"/>' +
  '<text x="50" y="66" text-anchor="middle" font-family="Inter,Arial Black,Arial,sans-serif" font-weight="900" font-size="23" fill="#0f1f4b" stroke="#b3202f" stroke-width=".8" letter-spacing="1">GFD</text>' +
  '<text x="50" y="77" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9.5" fill="#0f1f4b">Logistic</text>' +
  '<g fill="#b3202f"><path d="M37 82.5l1.3 2.7 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z"/><path d="M50 81l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/><path d="M63 82.5l1.3 2.7 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z"/></g></svg>';
const PAGES = [
  // L'essentiel en haut ; les documents ensuite ; le reste replié sous « Plus ».
  { id: "", ico: "dash", label: "Tableau de bord", render: pageHome },
  { id: "planning", ico: "cal", label: "Planning", render: pagePlanning },
  { id: "courses", ico: "euro", label: "Courses & CA", render: pageCourses },
  { id: "depenses", ico: "fuel", label: "Dépenses", render: pageExpenses },
  { id: "factures", ico: "file", label: "Factures", render: pageInvoices },
  { id: "facturation", ico: "filePlus", label: "Préparer une facture", render: pagePrepareInvoice },
  { id: "lettres", ico: "truck", label: "Lettres de voiture", render: pageLetters, group: "Documents" },
  { id: "rapprochement", ico: "swap", label: "Rapprochement", render: pageMatch, group: "Documents" },
  { id: "sous-traitants", ico: "building", label: "Sous-traitants", render: pageSubcontractors, group: "Documents" },
  { id: "administratif", ico: "folder", label: "Administratif", render: pageAdmin, group: "Documents" },
  { id: "chauffeurs", ico: "users", label: "Chauffeurs", render: pageDrivers, group: "Plus" },
  { id: "clients", ico: "target", label: "Clients & prospection", render: pageClients, group: "Plus" },
  { id: "activite", ico: "pulse", label: "Activité Soriya", render: pageActivity, group: "Plus" },
];
function route() {
  if (!DATA) return;
  const hash = location.hash.replace(/^#\/?/, ""), [id, arg] = hash.split("/");
  const p = PAGES.find(x => x.id === id) || PAGES[0];
  const link = x => {
    let cnt = "";
    if (x.id === "activite" && DATA.activities.some(a => a.lastErrors)) cnt = '<span class="cnt alert">!</span>';
    return '<a href="#/' + x.id + '" target="_self" class="' + (x === p ? "on" : "") + '"><span class="ico">' + icon(x.ico) + "</span>" + x.label + cnt + "</a>";
  };
  const grp = g => PAGES.filter(x => (x.group || "") === g).map(link).join("");
  document.getElementById("nav").innerHTML = grp("") + '<span style="flex:1"></span><details class="more-menu"><summary>Documents & plus</summary><div class="menu">' +
    '<div class="grp">Documents</div>' + grp("Documents") + '<div class="grp">Plus</div>' + grp("Plus") + "</div></details>";
  document.getElementById("title").firstChild.nodeValue = p.label;
  document.getElementById("sub").textContent = "Données à jour au " + DATA.generatedAt;
  document.getElementById("sideFoot").innerHTML = DATA.activities.map(a =>
    '<div><span class="dot" style="background:' + (a.lastErrors ? "#ff8a80" : "#6fcf8a") + '"></span> ' + esc(a.id) + " · " + esc(a.lastRun || "—") + "</div>").join("") +
    '<div style="margin-top:6px;opacity:.7">Actualisation auto toutes les 5 min</div>';
  document.getElementById("side").classList.remove("open");
  // Mobile : barre d'onglets en bas (les autres pages via « Plus »).
  const TABS = [["", "dash", "Accueil"], ["planning", "cal", "Planning"], ["courses", "euro", "Courses"], ["factures", "file", "Factures"]];
  document.getElementById("tabbar").innerHTML = TABS.map(t => '<a href="#/' + t[0] + '" target="_self" class="' + (p.id === t[0] ? "on" : "") + '">' + icon(t[1]) + "<span>" + t[2] + "</span></a>").join("") +
    '<button type="button" id="tabMore" class="' + (TABS.some(t => t[0] === p.id) ? "" : "on") + '">' + icon("more") + "<span>Plus</span></button>";
  document.getElementById("tabMore").onclick = () => { const sd = document.getElementById("side"), mm = document.querySelector("#nav .more-menu");
    sd.classList.toggle("open"); if (mm) mm.open = sd.classList.contains("open"); };
  p.render(document.getElementById("page"), arg ? decodeURIComponent(arg) : "");
  sceneStats();
}
window.addEventListener("hashchange", route);

/* ---------- Composants ---------- */
/** Volet repliable pour les informations secondaires (fermé par défaut, ouvert/fermé mémorisé pendant la visite). */
const FOLD = {};
const fold = (title, inner, open, extra) => '<details class="fold" data-f="' + esc(title) + '"' + ((FOLD[title] !== undefined ? FOLD[title] : open) ? " open" : "") +
  '><summary>' + esc(title) + (extra ? " " + extra : "") + '</summary><div class="fold-body">' + inner + "</div></details>";
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.fold")) FOLD[e.target.dataset.f] = e.target.open; }, true);
const tile = (label, value, extra, cls) => '<div class="tile ' + (cls || "") + '"><span>' + esc(label) + "</span><b>" + esc(value) + "</b>" + (extra || "") + "</div>";

function barRows(rows, total, onKey) {

function groupCA(list, keyFn, labelFn) {
  const o = {};

  return Object.values(o).map(r => Object.assign(r, { label: labelFn ? labelFn(r.key) : r.key, none: !r.key })).sort((a, b) => (a.none - b.none) || b.ca - a.ca);

/** Graphique en barres du CA mensuel (une seule échelle ; barre claire = projection du mois). */
function caChart(el) {
  const months = Object.keys(M.byMonth).filter(m => m <= M.thisMonth).sort().slice(-12);
  if (months.indexOf(M.thisMonth) < 0) months.push(M.thisMonth);
  const W = Math.max(280, el.clientWidth || 600), H = 220, L = 44, B = 24, T = 8;
  const val = m => M.byMonth[m] ? M.byMonth[m].ca : 0;
  const max = Math.max(1, ...months.map(val), M.projection);
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / nice);
  const band = (W - L) / months.length, bw = Math.min(30, band * 0.55);
  const bar = (x, v, extra) => { const yy = y(v), r = Math.min(4, (H - B - yy) / 2);
    return '<path d="M' + x + "," + (H - B) + "V" + (yy + r) + "Q" + x + "," + yy + " " + (x + r) + "," + yy + "H" + (x + bw - r) + "Q" + (x + bw) + "," + yy + " " + (x + bw) + "," + (yy + r) + "V" + (H - B) + 'Z" fill="var(--accent)"' + (extra || "") + "/>"; };
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Chiffre d\'affaires par mois">';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, yy = y(v);
    svg += '<line x1="' + L + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--grid)"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--ink-3)">' + (v >= 1000 ? Math.round(v / 1000) + " k" : Math.round(v)) + "</text>"; }
  months.forEach((m, i) => { const x = L + band * i + (band - bw) / 2;
    if (m === M.thisMonth && M.projection > val(m)) svg += bar(x, M.projection, ' opacity="0.25"');
    if (val(m)) svg += bar(x, val(m));
    svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10" fill="var(--ink-2)">' + MONTHS[+m.slice(5) - 1] + "</text>" +
      '<rect x="' + (L + band * i) + '" y="0" width="' + band + '" height="' + H + '" fill="transparent" data-m="' + m + '"/>'; });
  el.innerHTML = svg + '</svg><div class="tip"></div>';
  const tip = el.querySelector(".tip");
  el.querySelectorAll("rect[data-m]").forEach(r => {
    r.addEventListener("mousemove", ev => { const m = r.dataset.m, c = M.byMonth[m] || { ca: 0, n: 0 }, rect = el.getBoundingClientRect();
      tip.innerHTML = "<b>" + monthLabel(m) + "</b><br>CA : " + EUR.format(c.ca) + " · " + c.n + " course(s)" + (m === M.thisMonth ? "<br>Projection : " + EUR.format(M.projection) : "");
      tip.style.display = "block"; tip.style.left = Math.min(ev.clientX - rect.left + 12, rect.width - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(0, ev.clientY - rect.top - 50) + "px"; });
    r.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    r.addEventListener("click", () => { view.courses = Object.assign(view.courses || {}, { month: r.dataset.m, page: 0 }); location.hash = "#/courses"; });
  });
}

/** Tableau triable, paginé, exportable en CSV. */
function dataTable(host, rows, cols, opts) {
  const st = opts.state;
  st.sort = st.sort || opts.sort || cols[0].key; st.dir = st.dir || -1; st.page = st.page || 0;
  const get = (r, c) => c.val ? c.val(r) : r[c.key];
  rows = rows.slice().sort((a, b) => { const x = get(a, cols.find(c => c.key === st.sort) || cols[0]), y = get(b, cols.find(c => c.key === st.sort) || cols[0]);
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x || "").localeCompare(String(y || ""), "fr", { numeric: true })) * st.dir; });
  const per = 25, pages = Math.max(1, Math.ceil(rows.length / per)); st.page = Math.min(st.page, pages - 1);
  const slice = rows.slice(st.page * per, st.page * per + per);
  host.innerHTML = '<div class="table-wrap"><table><thead><tr>' + cols.map(c =>
    '<th data-s="' + c.key + '" class="' + (c.num ? "num " : "") + (c.sm ? "hide-sm" : "") + '">' + esc(c.label) + (st.sort === c.key ? (st.dir > 0 ? " ▲" : " ▼") : "") + "</th>").join("") + "</tr></thead><tbody>" +
    (slice.length ? slice.map((r, i) => {
      // En-tête de groupe (ex. mois) quand le tableau est trié par date : sous-total sur toute la sélection.
      let g = "";
      if (opts.group && st.sort === "date") {
        const k = opts.group.key(r), prev = i ? opts.group.key(slice[i - 1]) : null;
        if (k !== prev) g = '<tr class="grp"><td colspan="' + cols.length + '">' + esc(opts.group.label(k)) + "<span>" + opts.group.summary(rows.filter(x => opts.group.key(x) === k)) + "</span></td></tr>";
      }
      return g + '<tr data-i="' + (st.page * per + i) + '">' + cols.map(c => '<td class="' + (c.num ? "num " : "") + (c.nw ? "nw " : "") + (c.sm ? "hide-sm" : "") + '">' + (c.html ? c.html(r) : esc(get(r, c) == null || get(r, c) === "" ? "—" : get(r, c))) + "</td>").join("") + "</tr>";
    }).join("")
      : '<tr><td colspan="' + cols.length + '" class="empty">Aucun résultat.</td></tr>') +
    "</tbody>" + (opts.foot && rows.length ? "<tfoot><tr>" + cols.map(c => '<td class="' + (c.num ? "num " : "") + (c.sm ? "hide-sm" : "") + '">' + (opts.foot(rows, c) || "") + "</td>").join("") + "</tr></tfoot>" : "") + "</table>" + (pages > 1 ? '<div class="pager"><span class="muted small">Page ' + (st.page + 1) + " / " + pages + '</span><button type="button" data-p="-1">‹</button><button type="button" data-p="1">›</button></div>' : "") + "</div>";
  host.querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { st.dir = st.sort === th.dataset.s ? -st.dir : -1; st.sort = th.dataset.s; dataTable(host, rows, cols, opts); });
  host.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { st.page = Math.max(0, Math.min(pages - 1, st.page + +b.dataset.p)); dataTable(host, rows, cols, opts); });
  host.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.onclick = () => opts.onRow && opts.onRow(rows[+tr.dataset.i]));
  host._csv = () => [cols.map(c => c.label)].concat(rows.map(r => cols.map(c => { const v = c.csv ? c.csv(r) : get(r, c); return v == null ? "" : v; })));
}
/**
 * Pied de page des listes : totaux par mois et par chauffeur de la sélection affichée.
 * Un clic sur une ligne filtre le tableau sur ce mois / ce chauffeur (re-clic : retire le filtre).
 */
/** Type de prestation d'une course, d'après « Prestations réalisées » : FOURGON IDF, BREAK ILE DE FRANCE, GV ILE DE FRANCE… */
function vehicle(x) {
  const p = String(x.services || "").toUpperCase();
  if (/FOURGON/.test(p)) return "FOURGON IDF";
  if (/BREAK/.test(p)) return "BREAK ILE DE FRANCE";
  if (/\bGV\b|GRAND VOLUME/.test(p)) return "GV ILE DE FRANCE";
  return "";
}

function totalsPanel(host, rows, o) {
  const amt = o.amount || (() => 0), withCA = !!o.amount;
  const group = keyFn => { const g = {}; rows.forEach(x => { const k = keyFn(x); (g[k] = g[k] || { k, n: 0, ca: 0 }); g[k].n++; g[k].ca += amt(x); }); return Object.values(g); };
  const months = group(x => (x.date || "").slice(0, 7) || "—").sort((a, b) => b.k.localeCompare(a.k));
  const drivers = group(x => x.driver || "").sort((a, b) => (a.k === "") - (b.k === "") || b.n - a.n);
  const totN = rows.length, totCA = rows.reduce((t, x) => t + amt(x), 0);

      (withCA ? '<td class="num">' + EUR.format(r.ca) + '</td><td class="num hide-sm">' + EUR2.format(r.n ? r.ca / r.n : 0) + "</td>" : "") +
      '<td class="num">' + Math.round((withCA ? r.ca / (totCA || 1) : r.n / (totN || 1)) * 100) + " %</td></tr>").join("") +
    '</tbody><tfoot><tr><td>Total</td><td class="num">' + totN + "</td>" + (withCA ? '<td class="num">' + EUR.format(totCA) + '</td><td class="num hide-sm">' + EUR2.format(totN ? totCA / totN : 0) + "</td>" : "") + '<td class="num">100 %</td></tr></tfoot></table></div></div>';
  const vehicles = o.vehicle ? group(vehicle).sort((a, b) => (a.k === "") - (b.k === "") || b.ca - a.ca || b.n - a.n) : null;
  // CA par chauffeur et par prestation : une ligne par chauffeur, une colonne par type de prestation.
  const matrix = () => {
    const vs = vehicles.map(v => v.k), m = {};
    rows.forEach(x => { const d = x.driver || "", v = vehicle(x); const r = (m[d] = m[d] || { k: d, n: 0, ca: 0, c: {} });
      const c = (r.c[v] = r.c[v] || { n: 0, ca: 0 }); c.n++; c.ca += amt(x); r.n++; r.ca += amt(x); });

    return '<div class="card" style="grid-column:1/-1"><h2>CA par chauffeur et par prestation</h2><div class="table-wrap" style="border:0"><table><thead><tr><th>Chauffeur</th>' +

      list.map(r => '<tr data-d="' + esc(r.k) + '" class="' + ((o.driver && o.driver === r.k) || (o.driver === "-" && r.k === "") ? "on" : "") + '"><td>' + esc(r.k || "Sans chauffeur identifié") + "</td>" +
        vs.map(v => cell(r.c[v])).join("") + "<td class=\"num\"><b>" + EUR.format(r.ca) + '</b><div class="sub">' + r.n + " course" + (r.n > 1 ? "s" : "") + "</div></td></tr>").join("") +

  };

  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));

}

function tipsHtml() {
  const t = [], add = (k, a, b) => t.push('<li><span class="ic ' + k + '">' + ({ up: "▲", down: "▼", info: "●" })[k] + "</span><div><b>" + esc(a) + "</b><span>" + esc(b) + "</span></div></li>");
  if (M.avg3) { const v = M.projection / M.avg3 - 1;
    if (M.day < 7) add("info", "Début de mois : projection fragile", "Au rythme actuel ≈ " + EUR.format(M.projection) + " (moyenne 3 mois : " + EUR.format(M.avg3) + "). À confirmer après le 10.");
    else if (v >= 0.05) add("up", "Mois en hausse : " + pct(v), "Sécurisez chauffeurs et véhicules pour absorber la charge.");
    else if (v <= -0.05) add("down", "Mois en baisse : " + pct(v), "Relancez Ecotime et contactez vos prospects dès maintenant.");
    else add("info", "Activité stable", "Projection " + EUR.format(M.projection) + ", dans la moyenne."); }
  if (M.avg3 && M.avgPrev3) { const v = M.avg3 / M.avgPrev3 - 1; add(v >= 0 ? "up" : "down", "Tendance de fond : " + pct(v), "3 derniers mois vs les 3 précédents."); }
  const wd = [0, 0, 0, 0, 0, 0, 0]; let n = 0;
  M.sales.forEach(x => { const p = x.date.slice(0, 10).split("-").map(Number), w = new Date(p[0], p[1] - 1, p[2], 12).getDay(); if (!isNaN(w)) { wd[w] += x.amount; n++; } });
  if (n > 20) { const best = wd.indexOf(Math.max(...wd)), worst = [1, 2, 3, 4, 5].reduce((a, b) => wd[a] <= wd[b] ? a : b);
    add("info", "Jour le plus rentable : le " + DAYS[best], "Le " + DAYS[worst] + " est le plus calme : entretien, congés, prospection."); }
  const cl = groupCA(M.ytd, x => x.client); if (cl.length && cl[0].ca / (M.caYtd || 1) > (DATA.maxShareTopClient || 0.8))
    add("down", Math.round(cl[0].ca / M.caYtd * 100) + " % du CA vient de " + cl[0].key, "Voir le plan d'action dans « Clients & prospection ».");
  return t.join("");
}


const cap = t => String(t || "").toLowerCase().replace(/(^|[\s'(-])(\S)/g, (m, a, b) => a + b.toUpperCase());
const addDays = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };

/** Pièces administratives expirées ou qui expirent sous 30 jours (règles d'Ecotime : Kbis 3 mois, URSSAF 6 mois). */
function adminAlerts() {
  const list = ((DATA.admin || {}).list || []).filter(x => x.type !== "Demande de documents");
  const today = new Date().toISOString().slice(0, 10), out = [];
  ["Extrait Kbis", "Attestation de vigilance URSSAF", "Attestation d'assurance", "Licence de transport"].forEach(t => {
    const x = list.filter(y => y.type === t).sort((a, b) => (b.date || "").localeCompare(a.date || ""))[0];
    if (!x) return;
    const months = { "Extrait Kbis": 3, "Attestation de vigilance URSSAF": 6 }[t];
    let e = /^\d{4}-\d{2}-\d{2}$/.test(x.validUntil) ? x.validUntil : "";
    if (!e && months && /^\d{4}-\d{2}-\d{2}/.test(x.date)) { const d = new Date(x.date.slice(0, 10) + "T12:00:00"); d.setMonth(d.getMonth() + months); e = d.toISOString().slice(0, 10); }
    if (e && e < today) out.push({ type: t, txt: "expiré depuis le " + fmtDate(e) });
    else if (e && e <= addDays(today, 30)) out.push({ type: t, txt: "expire le " + fmtDate(e) });
  });
  return out;
}

/** Dernier relevé Ecotime entièrement lu : confirmations du mois qui n'y figurent pas. */
function releveGaps() {
  const R = DATA.releves || { list: [], lines: [] };
  const r = R.list.filter(x => x.current && /^\d{4}-\d{2}$/.test(x.month) && x.sts.every(s => s.read)).sort((a, b) => b.month.localeCompare(a.month))[0];
  if (!r) return null;
  const nums = {}; R.lines.filter(l => l.key === r.key).forEach(l => { nums[digits(l.number)] = 1; });
  const conf = {}; M.sales.filter(x => x.date.slice(0, 7) === r.month).forEach(x => { const k = digits(x.number); if (k) conf[k] = 1; });
  return { month: r.month, missing: Object.keys(conf).filter(k => !nums[k]).length };
}

/* ---------- Préparation de la facture GFD (mensuelle ou hebdomadaire) à partir des courses confirmées ---------- */
const COMPANY = { name: "GFD LOGISTIC", lines: ["1 avenue de Verdun", "93360 Neuilly-Plaisance", "06 52 13 53 08 · gfd.logistic@gmail.com"] };
const CLIENT = { name: "ECOTIME GROUP" };
const INVOICE_DUE_DAYS = 60; // échéance constatée sur les factures GFD (émise le 04/10, échéance le 03/12)
// Grille des produits de facture (libellés des factures GFD), par véhicule et prix unitaire HT.
const PRODUCTS = {
  GV: { 60: "Courses GV zone 1", 71: "Courses GV zone 2", 85: "Courses GV zone 3", 68: "Course GV Idf", 80: "Course GV Idf2",
    90: "Courses GV IdF", 100: "Course GV Province 1", 136: "Course GV Province 2", 156: "Course GV Province 3",
    30: "Annulations Courses GV Z1", 35.5: "Annulations Courses GV Z2", 42.5: "Annulations Courses GV Z3" },
  FG: { 41: "Courses Fourg Zone 1", 48: "Courses Fourg Zone 2", 20.5: "Annulations Courses Fourg Z1", 24: "Annulations Courses Fourg Z2" },
  BK: { 24: "Courses Break Zone 1", 32: "Courses Break Zone 2", 52: "Courses Break Zone 3", 12: "Annulations Courses Break Z1" },
};
const VEH_LABEL = { GV: "GV", FG: "Fourgon", BK: "Break" };
const amt = s => parseFloat(String(s).replace(/\s/g, "").replace(",", "."));
// « GV ILE DE FRANCE 17 60,00 € ; ATTENTE 1 20,00 € » → [{ label: "GV ILE DE FRANCE", amount: 60 }, { label: "ATTENTE", amount: 20 }]
function serviceParts(text) {
  const out = []; let pending = "";
  String(text || "").split(/\s*;\s*/).forEach(seg => {
    const label = (/^[^\d]*/.exec(seg)[0] || "").replace(/[:€]/g, "").trim();
    const m = seg.match(/\d+[.,]\d{1,2}/g);
    const a = m ? amt(m[m.length - 1]) : null;
    if (label && a === null) { pending = label; return; }
    if (a === null) return;
    out.push({ label: (label || pending).toUpperCase(), amount: a }); pending = "";
  });
  return out;
}
const vehicleOf = label => /FOURG/.test(label) ? "FG" : /BREAK/.test(label) ? "BK" : /\bGV\b/.test(label) ? "GV" : "";
// Produit d'après le véhicule et le prix ; prix hors grille du véhicule mais présent dans la grille GV : libellé GV
// (ex. Fourgon à 80 € facturé « Course GV Idf2 », comme sur la facture F-2026-1032).
const productFor = (v, price) => (PRODUCTS[v] || {})[price] || PRODUCTS.GV[price] || (VEH_LABEL[v] + " · autre tarif");
// Lignes de facture d'une course : prestation principale (produit selon véhicule et prix) + suppléments.
function courseItems(x) {
  const parts = serviceParts(x.services);
  const base = parts.find(p => vehicleOf(p.label)) || null;
  const veh = base ? vehicleOf(base.label) : vehicleOf(String(x.services).toUpperCase()) || "GV";
  const items = [];
  const product = productFor;
  // Montant retenu différent de la confirmation (annulation payée ½ tarif, non réalisée payée…) : une seule ligne.
  if (x.adj || !parts.length || Math.abs(parts.reduce((t, p) => t + p.amount, 0) - x.amount) > 0.01) {
    items.push({ product: product(veh, x.amount), price: x.amount, qty: 1, unit: "unité" });
    return items;
  }
  parts.forEach(p => {
    if (!p.amount) return;
    if (vehicleOf(p.label)) items.push({ product: product(vehicleOf(p.label), p.amount), price: p.amount, qty: 1, unit: "unité" });
    else if (/MANUT/.test(p.label)) items.push({ product: "Manutentions", price: 20, qty: p.amount / 20, unit: "unité" });
    else if (/ATTENTE/.test(p.label)) items.push({ product: "Attentes", price: 20, qty: p.amount / 20, unit: "unité" });
    else items.push({ product: p.label.charAt(0) + p.label.slice(1).toLowerCase(), price: p.amount, qty: 1, unit: "unité" });
  });
  return items;
}
// Ligne du relevé Ecotime (code prestation + montant) → ligne de facture ; LICEN (négatif) = remise.
function releveItem(l) {
  const sv = String(l.service).toUpperCase(), a = l.amount;
  const product = productFor;
  if (a < 0 || /^LICEN/.test(sv)) return { discount: -a };
  if (/^GV/.test(sv)) return { product: product("GV", a), price: a, qty: 1 };
  if (/^F/.test(sv)) return { product: product("FG", a), price: a, qty: 1 };
  if (/^B/.test(sv)) return { product: product("BK", a), price: a, qty: 1 };
  // Regroupements constatés sur les factures GFD : douane avec les attentes, relivraison au tarif de course GV.
  if (/^(MAN|EXPO)/.test(sv)) return { product: "Manutentions", price: 20, qty: a / 20 };
  if (/^(ATT|DOUAN)/.test(sv)) return { product: "Attentes", price: 20, qty: a / 20 };
  if (/^RELIV/.test(sv)) return { product: product("GV", a), price: a, qty: 1 };
  return { product: sv + " · autre", price: a, qty: 1 };
}
const PRODUCT_ORDER = ["Courses GV", "Course GV Idf", "Course GV Province", "Courses Fourg", "Courses Break", "GV ·", "Fourgon ·", "Break ·", "Annulations", "Manutentions", "Attentes"];

    '<div class="grid g4 noprint" id="iSum" style="margin-bottom:16px"></div><div id="iWarn" class="noprint"></div><div id="iSaved" class="noprint"></div><div id="iDoc"></div>' +
