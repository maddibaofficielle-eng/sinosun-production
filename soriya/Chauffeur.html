<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<title>GFD Logistic — espace chauffeur</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5f9; --surface: #ffffff; --line: #e2e6ef; --ink: #0f1b3d; --ink-2: #4b5572; --ink-3: #7d859b;
    --accent: #1b3170; --accent-soft: #e9eef8; --side: #0f1f4b; --bordeaux: #8c1c2f;
    --good: #16794a; --good-bg: #e4f4ec; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b3202f; --bad-bg: #fbe8ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #080e1f; --surface: #101a33; --line: #25325a; --ink: #f1f4fb; --ink-2: #b4bcd4; --ink-3: #8790ab;
      --accent: #3b5cc4; --accent-soft: #1a2750; --side: #0b1530; --bordeaux: #e0566b;
      --good: #5fd39b; --good-bg: #12301f; --warn: #f0c060; --warn-bg: #362a0f; --bad: #ff8a95; --bad-bg: #3a1720;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font: 16px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--side); color: #fff; padding: 16px 16px 14px; position: sticky; top: 0; z-index: 2; border-bottom: 4px solid var(--bordeaux); }
  .hd { display: flex; gap: 12px; align-items: center; } .hd .logo { width: 48px; height: 48px; flex: none; border-radius: 50%; background: #fff; padding: 2px; } .hd .logo svg { width: 100%; height: 100%; display: block; }
  header .hi { font-size: 20px; font-weight: 800; }
  header .sub { font-size: 13px; opacity: .8; }
  .days { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .days button { background: rgba(255,255,255,.12); color: #fff; border: 0; }
  .days b { margin-left: auto; font-size: 15px; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  button, select, input, textarea { font: inherit; border-radius: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-height: 44px; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 { font-size: 15px; margin: 18px 2px 10px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15,27,61,.05), 0 6px 20px rgba(15,27,61,.05); }
  .r1 { display: flex; align-items: baseline; gap: 8px; }
  .t { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .n { margin-left: auto; color: var(--ink-3); font-size: 13px; }
  .addr { margin: 8px 0 4px; font-size: 15px; }
  .addr div { display: flex; gap: 8px; } .addr .k { color: var(--ink-3); min-width: 72px; font-size: 13px; padding-top: 2px; }
  .goods { color: var(--ink-2); font-size: 13px; }
  .pill { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .ok { color: var(--good); background: var(--good-bg); } .warn { color: var(--warn); background: var(--warn-bg); } .bad { color: var(--bad); background: var(--bad-bg); }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .acts.one { grid-template-columns: 1fr; }
  .inc { margin-top: 8px; font-size: 13px; }
  .muted { color: var(--ink-2); } .small { font-size: 13px; }
  .empty { color: var(--ink-2); padding: 8px 2px 4px; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog form { padding: 18px; display: grid; gap: 10px; }
  dialog h3 { margin: 0 0 4px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  label.f { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: none; max-width: calc(100vw - 32px); }
  .gen { display: block; width: 100%; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="hd"><div class="logo" id="logo"></div><div><div class="hi">Bonjour <?= driver ?></div>
  <div class="sub">GFD Logistic · vos courses et lettres de voiture</div></div></div>
  <div class="days"><button type="button" data-d="-1" aria-label="Jour précédent">‹</button><button type="button" data-d="0">Aujourd'hui</button><button type="button" data-d="1" aria-label="Jour suivant">›</button><b id="day"></b></div>
</header>
<main>
  <div id="list"><p class="muted">Chargement…</p></div>
  <button type="button" class="gen" id="genLdv">📄 Envoyer une autre lettre de voiture</button>
</main>
<input type="file" id="file" accept="image/*,application/pdf" capture="environment" hidden>

<dialog id="dlg"><form method="dialog" id="incForm">
  <h3>Signaler un incident</h3>
  <div class="small muted" id="incCourse"></div>
  <label class="f">Type<select id="incType" required></select></label>
  <label class="f" id="incMinL">Durée d'attente (minutes)<input id="incMin" type="number" inputmode="numeric" min="0" step="5" placeholder="ex. 30"></label>
  <label class="f">Commentaire<textarea id="incTxt" rows="3" placeholder="Ce qui s'est passé…"></textarea></label>
  <label class="f">Photo (facultatif)<input id="incPhoto" type="file" accept="image/*" capture="environment"></label>
  <div class="row"><button type="button" id="incCancel">Annuler</button><button type="submit" class="primary" id="incSend">Envoyer</button></div>
</form></dialog>
<div id="toast" role="status"></div>

<script>
const TOKEN = <?!= JSON.stringify(token) ?>;
const TYPES = <?!= JSON.stringify(types) ?>;
const DAYS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isoDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return isoDay(x); };
const num = n => n.length === 6 ? n.slice(0, 3) + " " + n.slice(3) : n;
const today = isoDay(new Date());
let day = today, data = null, target = null;

function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = "none", 4000); }
function call(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}
function load() {
  const x = new Date(day + "T12:00:00");
  document.getElementById("day").textContent = (day === today ? "Aujourd'hui · " : "") + DAYS[x.getDay()] + " " + x.getDate() + " " + MONTHS[x.getMonth()];
  call("soriyaDriverData", TOKEN, day).then(d => { data = d; draw(); })
    .catch(e => { document.getElementById("list").innerHTML = '<div class="card bad">' + esc(e.message) + "</div>"; });
}
function card(c, mine) {
  const inc = (data.incidents || []).filter(i => i.n === c.n);
  const st = c.letter === "reçue" ? '<span class="pill ok">✔ Lettre reçue</span>' : c.letter === "en lecture" ? '<span class="pill warn">Lettre envoyée · en lecture</span>' : mine ? '<span class="pill bad">Lettre à envoyer</span>' : "";
  return '<div class="card"><div class="r1"><span class="t">' + (c.pickup || "—:—") + "</span>" + (c.delivery ? '<span class="small muted">livraison avant ' + c.delivery + "</span>" : "") + '<span class="n">n° ' + esc(num(c.n)) + "</span></div>" +
    '<div class="addr"><div><span class="k">Enlèvement</span><span>' + esc(c.from) + '</span></div><div><span class="k">Livraison</span><span>' + esc(c.to) + "</span></div></div>" +
    (c.goods ? '<div class="goods">' + esc(c.goods) + "</div>" : "") + '<div style="margin-top:8px">' + st + "</div>" +
    inc.map(i => '<div class="inc"><span class="pill warn">⚠ ' + esc(i.type) + (i.minutes ? " · " + esc(i.minutes) + " min" : "") + "</span> " + esc(i.comment) + "</div>").join("") +
    (mine ? '<div class="acts"><button type="button" class="primary" data-ldv="' + c.n + '">📄 ' + (c.letter ? "Renvoyer la lettre" : "Envoyer la lettre") + '</button><button type="button" data-inc="' + c.n + '">⚠ Incident</button></div>'
      : '<div class="acts one"><button type="button" data-claim="' + c.n + '">C\'est ma course</button></div>') + "</div>";
}
function draw() {
  const host = document.getElementById("list");
  host.innerHTML = "<h2>Mes courses (" + data.mine.length + ")</h2>" +
    (data.mine.map(c => card(c, true)).join("") || '<div class="empty">Aucune course affectée pour ce jour.</div>') +
    (data.free.length ? "<h2>Courses non affectées (" + data.free.length + ")</h2>" + data.free.map(c => card(c, false)).join("") : "");
  host.querySelectorAll("[data-ldv]").forEach(b => b.onclick = () => { target = b.dataset.ldv; document.getElementById("file").click(); });
  host.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => openInc(b.dataset.inc));
  host.querySelectorAll("[data-claim]").forEach(b => b.onclick = () => { b.disabled = true;
    call("soriyaDriverClaim", TOKEN, b.dataset.claim).then(() => { toast("Course ajoutée à vos courses."); load(); }).catch(e => { b.disabled = false; toast(e.message); }); });
}
// Photo réduite (1600 px, JPEG) avant envoi : rapide même en 4G.
function readFile(f) {
  return new Promise((ok, ko) => {
    if (f.type === "application/pdf") { const r = new FileReader(); r.onload = () => ok({ mime: f.type, b64: String(r.result).split(",")[1] }); r.onerror = ko; r.readAsDataURL(f); return; }
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok({ mime: "image/jpeg", b64: c.toDataURL("image/jpeg", 0.85).split(",")[1] }); };
    img.onerror = () => ko(new Error("Image illisible")); img.src = url;
  });
}
document.getElementById("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  toast("Envoi de la lettre…");
  try { const r = await readFile(f); await call("soriyaDriverUpload", TOKEN, target || "", f.name, r.mime, r.b64);
    toast("Lettre envoyée ✔ Soriya la lit dans quelques minutes."); load(); }
  catch (err) { toast("Envoi impossible : " + err.message); }
};
document.getElementById("genLdv").onclick = () => { target = ""; document.getElementById("file").click(); };
function openInc(n) {
  target = n;
  document.getElementById("incCourse").textContent = "Course n° " + num(n);
  document.getElementById("incType").innerHTML = TYPES.map(t => "<option>" + esc(t) + "</option>").join("");
  document.getElementById("incMin").value = ""; document.getElementById("incTxt").value = ""; document.getElementById("incPhoto").value = "";
  document.getElementById("incMinL").style.display = "";
  document.getElementById("dlg").showModal();
}
document.getElementById("incType").onchange = e => { document.getElementById("incMinL").style.display = /Attente|Retard/.test(e.target.value) ? "" : "none"; };
document.getElementById("incCancel").onclick = () => document.getElementById("dlg").close();
document.getElementById("incForm").onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById("incSend"); btn.disabled = true;
  try {
    const p = document.getElementById("incPhoto").files[0], ph = p ? await readFile(p) : { mime: "", b64: "" };
    await call("soriyaDriverIncident", TOKEN, target, day, document.getElementById("incType").value, document.getElementById("incMin").value,
      document.getElementById("incTxt").value, ph.mime, ph.b64);
    document.getElementById("dlg").close(); toast("Incident transmis au gérant ✔"); load();
  } catch (err) { toast("Envoi impossible : " + err.message); }
  btn.disabled = false;
};
document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const v = +b.dataset.d; day = v === 0 ? today : addDays(day, v); load(); });
const GFD_LOGO = '<svg viewBox="0 0 100 100" role="img" aria-label="GFD Logistic"><circle cx="50" cy="50" r="48" fill="#fff"/><circle cx="50" cy="50" r="44" fill="none" stroke="#0f1f4b" stroke-width="3"/>' +
  '<path d="M27 44a24 24 0 0 1 46 0" fill="none" stroke="#0f1f4b" stroke-width="6" stroke-dasharray="3 2.2"/><path d="M50 44 61 18" stroke="#b3202f" stroke-width="3.2" stroke-linecap="round"/><circle cx="50" cy="44" r="3.2" fill="#0f1f4b"/>' +
  '<text x="50" y="66" text-anchor="middle" font-family="Inter,Arial Black,Arial,sans-serif" font-weight="900" font-size="23" fill="#0f1f4b" stroke="#b3202f" stroke-width=".8" letter-spacing="1">GFD</text>' +
  '<text x="50" y="77" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9.5" fill="#0f1f4b">Logistic</text>' +
  '<g fill="#b3202f"><path d="M37 82.5l1.3 2.7 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z"/><path d="M50 81l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/><path d="M63 82.5l1.3 2.7 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z"/></g></svg>';
document.getElementById("logo").innerHTML = GFD_LOGO;
load();
</script>
</body>
</html>
