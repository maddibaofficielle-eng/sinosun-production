<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_blank">
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f1; --surface: #fcfcfb; --surface-2: #ffffff; --line: #e4e3df; --grid: #ecebe7;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #7a7974;
    --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: #e7f0fb;
    --s-conf: #2a78d6; --s-ldv: #eb6834;
    --side: #0f2747; --side-ink: #d6e2f3; --side-act: #1c5cab;
    --ca-from: #1c5cab; --ca-to: #0d366b;
    --m1: #b7d3f6; --m2: #86b6ef; --m3: #5598e7; --m4: #2a78d6; --m5: #184f95; --m-old: #c9c8c2;
    --good: #1a7f37; --good-bg: #e6f4ea; --warn: #9a6700; --warn-bg: #fff4d6; --bad: #c5221f; --bad-bg: #fce8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #33332f; --grid: #2a2a27;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e86;
      --accent: #3987e5; --accent-soft: #16263b; --s-conf: #3987e5; --s-ldv: #d95926;
      --side: #0b1726; --side-ink: #c3d3ea; --side-act: #184f95;
      --ca-from: #184f95; --ca-to: #0d2a55;
      --m1: #104281; --m2: #1c5cab; --m3: #3987e5; --m4: #6da7ec; --m5: #b7d3f6; --m-old: #5c5b56;
      --good: #6fcf8a; --good-bg: #16301e; --warn: #f0c060; --warn-bg: #362a0f; --bad: #ff8a80; --bad-bg: #3a1716;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); }
  button, select, input {
    font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; min-height: 40px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--ink-3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Structure de l'application ---------- */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); color: var(--side-ink); padding: 18px 12px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: #fff; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #3987e5, #eb6834);
    display: grid; place-items: center; font-weight: 800; }
  .brand b { display: block; font-size: 17px; }
  .brand small { color: var(--side-ink); font-size: 12px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--side-ink);
    text-decoration: none; font-size: 14px; font-weight: 500; }
  .nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav a.on { background: var(--side-act); color: #fff; }
  .nav .ico { width: 20px; text-align: center; }
  .nav .cnt { margin-left: auto; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.14); border-radius: 999px; padding: 1px 7px; }
  .nav .cnt.alert { background: #c5221f; color: #fff; }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--side-ink); padding: 8px; line-height: 1.5; }
  .main { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 12px 24px; }
  .top h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .top small { color: var(--ink-2); font-size: 12px; display: block; font-weight: 400; }
  .top .sp { flex: 1; }
  .menu-btn { display: none; }
  .page { padding: 20px 24px 48px; max-width: 1400px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .more { margin-left: auto; font-size: 13px; font-weight: 500; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  /* Tuiles KPI */
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  .tile span { font-size: 12px; color: var(--ink-2); display: block; }
  .tile b { display: block; font-size: 26px; line-height: 1.15; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tile em { font-style: normal; font-size: 12px; font-weight: 600; }
  .tile.hero { background: linear-gradient(135deg, var(--ca-from), var(--ca-to)); color: #fff; border: 0; }
  .tile.hero span { color: rgba(255,255,255,.82); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .tile.hero .up { color: #bff0cd; } .tile.hero .down { color: #ffd0cc; }
  .tile.hero .muted { color: rgba(255,255,255,.8) !important; }
  td.nw { white-space: nowrap; }
  #refresh { white-space: nowrap; }
  @media (max-width: 520px) { #refresh .lbl { display: none; } }

  /* Pastilles */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { color: var(--good); background: var(--good-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .pill.info { color: var(--accent); background: var(--accent-soft); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .badge.fort { background: var(--good-bg); color: var(--good); }
  .badge.moyen { background: var(--warn-bg); color: var(--warn); }
  .badge.faible { background: var(--grid); color: var(--ink-2); }

  /* Barre d'outils + tableau */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1 1 240px; }
  .toolbar .count { color: var(--ink-2); font-size: 13px; margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--surface-2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--ink-2); font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  th[data-s] { cursor: pointer; }
  th[data-s]:hover { color: var(--ink); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface-2); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .route b { font-weight: 500; }
  tbody tr:nth-child(even):not(.grp) td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  tr.grp td { background: var(--accent-soft) !important; color: var(--ink); font-weight: 700; font-size: 13px; cursor: default; padding: 8px 12px; }
  tr.grp td span { font-weight: 500; color: var(--ink-2); margin-left: 8px; }
  tfoot td { white-space: nowrap; position: sticky; bottom: 0; background: var(--surface); border-top: 2px solid var(--line); font-weight: 700; padding: 12px; }
  .totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  .totals .card { padding: 12px 14px; }
  .totals table { font-size: 13px; }
  .totals th, .totals td { padding: 7px 10px; }
  .totals tbody tr:hover td { background: var(--accent-soft); }
  .totals tr.on td { background: var(--accent-soft); font-weight: 700; }
  .totals tfoot td { position: static; }
  .totals .sub { font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .totals td.muted { color: var(--ink-3); }
  @media (max-width: 860px) { .totals { grid-template-columns: 1fr; } }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 12px; }
  .empty { padding: 32px; text-align: center; color: var(--ink-2); }

  /* Listes à barres (chauffeurs, clients) */
  .bars { display: grid; gap: 2px; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
  .bar-row:last-child { border-bottom: 0; }
  .bar-row .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row small { color: var(--ink-2); font-size: 12px; grid-column: 1 / -1; }
  .bar-row .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .bar-row .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .bar-row.none .bar i { background: var(--ink-3); }

  /* Graphiques */
  .chart { width: 100%; height: 220px; position: relative; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 3; }
  .donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .donut { width: 200px; height: 200px; position: relative; flex: none; }
  .donut svg { width: 100%; height: 100%; display: block; }
  .dleg { flex: 1 1 180px; display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .dleg li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 14px; border-radius: 6px; padding: 3px 4px; }
  .dleg li.on { background: var(--surface-2); }
  .dleg i { width: 12px; height: 12px; border-radius: 3px; }
  .dleg small { color: var(--ink-2); min-width: 36px; text-align: right; }

  /* Alertes / conseils */
  .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .tips li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
  .tips .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; }
  .tips .ic.up { background: var(--good-bg); color: var(--good); }
  .tips .ic.down { background: var(--bad-bg); color: var(--bad); }
  .tips .ic.info { background: var(--warn-bg); color: var(--warn); }
  .tips b { display: block; }
  .tips span, .tips a { font-size: 13px; }
  .tips span { color: var(--ink-2); }

  /* Chauffeurs */
  .drivers { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .drv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
  .drv-card:hover { border-color: var(--accent); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--accent); }
  .drv-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .drv-head b { display: block; }
  .drv-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .drv-stats div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .drv-stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .drv-stats span { font-size: 11px; color: var(--ink-2); }

  /* Prospection : tableau Kanban */
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 120px; }
  .col h3 { font-size: 13px; margin: 2px 4px 10px; display: flex; justify-content: space-between; color: var(--ink-2); }
  .pcard { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .pcard a { font-weight: 600; color: var(--ink); text-decoration: none; font-size: 14px; }
  .pcard a:hover { text-decoration: underline; }
  .pcard p { margin: 6px 0; color: var(--ink-2); }
  .meter { position: relative; height: 12px; border-radius: 6px; background: var(--grid); margin: 14px 0 6px; }
  .meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); }
  .meter > b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }

  /* Panneau de détail */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); z-index: 21;
    box-shadow: -8px 0 32px rgba(0,0,0,.2); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .drawer header h3 { margin: 0; font-size: 17px; flex: 1; }
  .drawer .body { padding: 16px 20px; overflow: auto; }
  .kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .link-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 14px 0; background: var(--surface-2); }

  @media (max-width: 1100px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 30; width: 260px; left: 0; transform: translateX(-100%); transition: transform .2s ease; }
    .side.open { transform: none; }
    .menu-btn { display: inline-block; }
    .g2, .g3 { grid-template-columns: 1fr; }
    .span2 { grid-column: auto; }
    .page, .top { padding-left: 16px; padding-right: 16px; }
    .hide-sm { display: none; }
    .kv { grid-template-columns: 120px minmax(0, 1fr); }
  }
  @media (max-width: 520px) { .g6, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile b { font-size: 21px; } }
</style>
</head>

    <div class="top">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <h1 id="title">Tableau de bord<small id="sub">chargement…</small></h1>

      <button id="refresh" type="button" title="Actualiser">↻<span class="lbl"> Actualiser</span></button>

  </div>
</div>
<div class="drawer-bg" id="drawerBg"></div>

<script>
const KEY = <?!= JSON.stringify(key) ?>;
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const DAYS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const EUR = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const EUR2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 });
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = d => /^\d{4}-\d{2}-\d{2}/.test(d || "") ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : esc(d || "—");
const monthLabel = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const pct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + " %";
const digits = s => String(s || "").replace(/\D/g, "");
const short = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const city = s => { const m = /(\d{5})\s+([^,(]+)/.exec(s || ""); return m ? m[2].trim() + " (" + m[1].slice(0, 2) + ")" : short((s || "").split(",")[0], 28); };
function normParty(p) {
  return (String(p || "").split(/,| - /)[0] || "").trim().toUpperCase().replace(/\s+(GROUP|GROUPE|SAS|SARL|SA)$/, "") || "NON RENSEIGNÉ";
}
const statusKind = s => s.indexOf("Archivé") === 0 && s.indexOf("impossible") < 0 ? "ok" : (s.indexOf("À vérifier") === 0 || s.indexOf("Mis de côté") === 0 ? "warn" : "bad");
const statusShort = s => (s || "—").split(" — ")[0];

let DATA = null, M = null;           // données brutes et dérivées
const view = {};                     // état des filtres par page

/* ---------- Chargement ---------- */
function load() {
  document.getElementById("sub").textContent = "actualisation…";
  google.script.run
    .withSuccessHandler(d => { DATA = d; M = derive(d); route(); })
    .withFailureHandler(e => { document.getElementById("page").innerHTML = '<div class="empty">Impossible de charger les données : ' + esc(e.message) + "</div>"; })
    .soriyaWebData(KEY);
}

/** Calculs communs : courses facturées, rapprochement confirmation ↔ lettre de voiture, mois… */
function derive(d) {
  const conf = d.docs.filter(x => x.type === "conf"), ldv = d.docs.filter(x => x.type === "ldv");
  const ldvByNum = {}, confByNum = {};
  ldv.forEach(x => { const k = digits(x.number); if (k && !ldvByNum[k]) ldvByNum[k] = x; });
  conf.forEach(x => { const k = digits(x.number); if (k && !confByNum[k]) confByNum[k] = x; });
  conf.forEach(x => { x.ldv = ldvByNum[digits(x.number)] || null; x.client = normParty(x.party); if (!x.driver && x.ldv) x.driver = x.ldv.driver; });
  ldv.forEach(x => { x.conf = confByNum[digits(x.number)] || null; });
  const sales = conf.filter(x => x.status.indexOf("Archivé") === 0 && x.amount > 0 && /^\d{4}-\d{2}-\d{2}/.test(x.date));
  const now = new Date(), thisMonth = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const prevD = new Date(now.getFullYear(), now.getMonth() - 1, 1), prevMonth = prevD.getFullYear() + "-" + String(prevD.getMonth() + 1).padStart(2, "0");
  const day = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const byMonth = {};
  sales.forEach(x => { const m = x.date.slice(0, 7); (byMonth[m] = byMonth[m] || { ca: 0, n: 0 }); byMonth[m].ca += x.amount; byMonth[m].n++; });
  const sum = a => a.reduce((t, x) => t + x.amount, 0);
  const mtd = sales.filter(x => x.date.slice(0, 7) === thisMonth);
  const ytd = sales.filter(x => x.date.slice(0, 4) === String(now.getFullYear()));
  const prevSame = sales.filter(x => x.date.slice(0, 7) === prevMonth && +x.date.slice(8, 10) <= day);
  const closed = Object.keys(byMonth).filter(m => m < thisMonth && byMonth[m].n >= 10).sort();
  const avg = ms => ms.length ? ms.reduce((t, m) => t + byMonth[m].ca, 0) / ms.length : 0;
  const caMtd = sum(mtd);
  const toCheck = d.docs.filter(x => statusKind(x.status) !== "ok");
  const noLdv = mtd.filter(x => !x.ldv);
  return {
    conf, ldv, sales, byMonth, mtd, ytd, now, thisMonth, prevMonth, day, dim, closed,
    caMtd, caYtd: sum(ytd), caPrevSame: sum(prevSame), projection: day ? caMtd / day * dim : 0,

/** Graphique en barres du CA mensuel (une seule échelle ; barre claire = projection du mois). */
function caChart(el) {
  const months = Object.keys(M.byMonth).filter(m => m <= M.thisMonth).sort().slice(-12);
  if (months.indexOf(M.thisMonth) < 0) months.push(M.thisMonth);
  const W = Math.max(280, el.clientWidth || 600), H = 220, L = 44, B = 24, T = 8;
  const val = m => M.byMonth[m] ? M.byMonth[m].ca : 0;
  const max = Math.max(1, ...months.map(val), M.projection);
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / nice);
  const band = (W - L) / months.length, bw = Math.min(30, band * 0.55);
  const bar = (x, v, extra) => { const yy = y(v), r = Math.min(4, (H - B - yy) / 2);
    return '<path d="M' + x + "," + (H - B) + "V" + (yy + r) + "Q" + x + "," + yy + " " + (x + r) + "," + yy + "H" + (x + bw - r) + "Q" + (x + bw) + "," + yy + " " + (x + bw) + "," + (yy + r) + "V" + (H - B) + 'Z" fill="var(--accent)"' + (extra || "") + "/>"; };
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Chiffre d\'affaires par mois">';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, yy = y(v);
    svg += '<line x1="' + L + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--grid)"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--ink-3)">' + (v >= 1000 ? Math.round(v / 1000) + " k" : Math.round(v)) + "</text>"; }
  months.forEach((m, i) => { const x = L + band * i + (band - bw) / 2;
    if (m === M.thisMonth && M.projection > val(m)) svg += bar(x, M.projection, ' opacity="0.25"');
    if (val(m)) svg += bar(x, val(m));
    svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10" fill="var(--ink-2)">' + MONTHS[+m.slice(5) - 1] + "</text>" +
      '<rect x="' + (L + band * i) + '" y="0" width="' + band + '" height="' + H + '" fill="transparent" data-m="' + m + '"/>'; });
  el.innerHTML = svg + '</svg><div class="tip"></div>';
  const tip = el.querySelector(".tip");
  el.querySelectorAll("rect[data-m]").forEach(r => {
    r.addEventListener("mousemove", ev => { const m = r.dataset.m, c = M.byMonth[m] || { ca: 0, n: 0 }, rect = el.getBoundingClientRect();
      tip.innerHTML = "<b>" + monthLabel(m) + "</b><br>CA : " + EUR.format(c.ca) + " · " + c.n + " course(s)" + (m === M.thisMonth ? "<br>Projection : " + EUR.format(M.projection) : "");
      tip.style.display = "block"; tip.style.left = Math.min(ev.clientX - rect.left + 12, rect.width - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(0, ev.clientY - rect.top - 50) + "px"; });
    r.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    r.addEventListener("click", () => { view.courses = Object.assign(view.courses || {}, { month: r.dataset.m, page: 0 }); location.hash = "#/courses"; });
  });
}

/** Camembert (anneau) des documents par mois : 5 derniers mois + « Mois précédents ». */
function donut(el, leg) {
  const counts = {};
  DATA.docs.forEach(x => { const m = (x.date || "").slice(0, 7); if (/^\d{4}-\d{2}$/.test(m)) (counts[m] = counts[m] || { conf: 0, ldv: 0 })[x.type]++; });
  const months = Object.keys(counts).sort(); if (!months.length) return;
  const recent = months.slice(-5), older = months.slice(0, -5);
  const parts = older.length ? [{ label: "Mois précédents (" + older.length + ")", conf: 0, ldv: 0, color: "var(--m-old)" }] : [];
  older.forEach(m => { parts[0].conf += counts[m].conf; parts[0].ldv += counts[m].ldv; });
  const ramp = ["var(--m1)", "var(--m2)", "var(--m3)", "var(--m4)", "var(--m5)"].slice(-recent.length);
  recent.forEach((m, i) => parts.push({ label: monthLabel(m), conf: counts[m].conf, ldv: counts[m].ldv, color: ramp[i] }));
  const total = parts.reduce((t, p) => t + p.conf + p.ldv, 0), R = 100, r = 64, C = 110;
  let a0 = -Math.PI / 2, svg = '<svg viewBox="0 0 220 220" role="img" aria-label="Documents par mois">';
  parts.forEach((p, i) => { const a1 = a0 + (p.conf + p.ldv) / total * Math.PI * 2, s = a0 + 0.012, e = Math.max(s + 0.001, a1 - 0.012), lg = e - s > Math.PI ? 1 : 0;
    const P = (rad, a) => (C + rad * Math.cos(a)).toFixed(2) + "," + (C + rad * Math.sin(a)).toFixed(2);
    svg += '<path d="M' + P(R, s) + "A" + R + "," + R + " 0 " + lg + " 1 " + P(R, e) + "L" + P(r, e) + "A" + r + "," + r + " 0 " + lg + " 0 " + P(r, s) + 'Z" fill="' + p.color + '" data-i="' + i + '"/>'; a0 = a1; });
  el.innerHTML = svg + '<text x="110" y="106" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">' + total + '</text><text x="110" y="128" text-anchor="middle" font-size="12" fill="var(--ink-2)">documents</text></svg><div class="tip"></div>';
  leg.innerHTML = parts.slice().reverse().map(p => '<li data-i="' + parts.indexOf(p) + '"><i style="background:' + p.color + '"></i><span>' + esc(p.label) + "</span><b>" + (p.conf + p.ldv) + "</b><small>" + Math.round((p.conf + p.ldv) / total * 100) + " %</small></li>").join("");
  const tip = el.querySelector(".tip");
  const show = (i, ev) => { const p = parts[i], rect = el.getBoundingClientRect();
    tip.innerHTML = "<b>" + esc(p.label) + '</b><br><i class="dot" style="background:var(--s-conf)"></i> Confirmations : ' + p.conf + '<br><i class="dot" style="background:var(--s-ldv)"></i> Lettres de voiture : ' + p.ldv;
    tip.style.display = "block"; tip.style.left = (ev ? Math.min(ev.clientX - rect.left + 12, rect.width - 20) : 110) + "px"; tip.style.top = (ev ? Math.max(0, ev.clientY - rect.top - 40) : 10) + "px";
    leg.querySelectorAll("li").forEach(li => li.classList.toggle("on", +li.dataset.i === i)); };
  const hide = () => { tip.style.display = "none"; leg.querySelectorAll("li").forEach(li => li.classList.remove("on")); };
  el.querySelectorAll("[data-i]").forEach(x => { x.addEventListener("mousemove", ev => show(+x.dataset.i, ev)); x.addEventListener("mouseleave", hide); });
  leg.querySelectorAll("li").forEach(li => { li.addEventListener("mouseenter", () => show(+li.dataset.i)); li.addEventListener("mouseleave", hide); });
}

/** Tableau triable, paginé, exportable en CSV. */
function dataTable(host, rows, cols, opts) {
  const st = opts.state;
  st.sort = st.sort || opts.sort || cols[0].key; st.dir = st.dir || -1; st.page = st.page || 0;
  const get = (r, c) => c.val ? c.val(r) : r[c.key];
  rows = rows.slice().sort((a, b) => { const x = get(a, cols.find(c => c.key === st.sort) || cols[0]), y = get(b, cols.find(c => c.key === st.sort) || cols[0]);
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x || "").localeCompare(String(y || ""), "fr", { numeric: true })) * st.dir; });
  const per = 50, pages = Math.max(1, Math.ceil(rows.length / per)); st.page = Math.min(st.page, pages - 1);
  const slice = rows.slice(st.page * per, st.page * per + per);
  host.innerHTML = '<div class="table-wrap"><table><thead><tr>' + cols.map(c =>
    '<th data-s="' + c.key + '" class="' + (c.num ? "num " : "") + (c.sm ? "hide-sm" : "") + '">' + esc(c.label) + (st.sort === c.key ? (st.dir > 0 ? " ▲" : " ▼") : "") + "</th>").join("") + "</tr></thead><tbody>" +
    (slice.length ? slice.map((r, i) => {
      // En-tête de groupe (ex. mois) quand le tableau est trié par date : sous-total sur toute la sélection.
      let g = "";
      if (opts.group && st.sort === "date") {
        const k = opts.group.key(r), prev = i ? opts.group.key(slice[i - 1]) : null;
        if (k !== prev) g = '<tr class="grp"><td colspan="' + cols.length + '">' + esc(opts.group.label(k)) + "<span>" + opts.group.summary(rows.filter(x => opts.group.key(x) === k)) + "</span></td></tr>";
      }
      return g + '<tr data-i="' + (st.page * per + i) + '">' + cols.map(c => '<td class="' + (c.num ? "num " : "") + (c.nw ? "nw " : "") + (c.sm ? "hide-sm" : "") + '">' + (c.html ? c.html(r) : esc(get(r, c) == null || get(r, c) === "" ? "—" : get(r, c))) + "</td>").join("") + "</tr>";
    }).join("")
      : '<tr><td colspan="' + cols.length + '" class="empty">Aucun résultat.</td></tr>') +
    "</tbody>" + (opts.foot && rows.length ? "<tfoot><tr>" + cols.map(c => '<td class="' + (c.num ? "num " : "") + (c.sm ? "hide-sm" : "") + '">' + (opts.foot(rows, c) || "") + "</td>").join("") + "</tr></tfoot>" : "") + "</table>" + (pages > 1 ? '<div class="pager"><span class="muted small">Page ' + (st.page + 1) + " / " + pages + '</span><button type="button" data-p="-1">‹</button><button type="button" data-p="1">›</button></div>' : "") + "</div>";
  host.querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { st.dir = st.sort === th.dataset.s ? -st.dir : -1; st.sort = th.dataset.s; dataTable(host, rows, cols, opts); });
  host.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { st.page = Math.max(0, Math.min(pages - 1, st.page + +b.dataset.p)); dataTable(host, rows, cols, opts); });
  host.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.onclick = () => opts.onRow && opts.onRow(rows[+tr.dataset.i]));
  host._csv = () => [cols.map(c => c.label)].concat(rows.map(r => cols.map(c => { const v = c.csv ? c.csv(r) : get(r, c); return v == null ? "" : v; })));
}
/**
 * Pied de page des listes : totaux par mois et par chauffeur de la sélection affichée.

/** Type de prestation d'une course, d'après « Prestations réalisées » : FOURGON IDF, BREAK ILE DE FRANCE, GV ILE DE FRANCE… */
function vehicle(x) {

  if (/FOURGON/.test(p)) return "FOURGON IDF";
  if (/BREAK/.test(p)) return "BREAK ILE DE FRANCE";

}

function tipsHtml() {
  const t = [], add = (k, a, b) => t.push('<li><span class="ic ' + k + '">' + ({ up: "▲", down: "▼", info: "●" })[k] + "</span><div><b>" + esc(a) + "</b><span>" + esc(b) + "</span></div></li>");
  if (M.avg3) { const v = M.projection / M.avg3 - 1;
    if (M.day < 7) add("info", "Début de mois : projection fragile", "Au rythme actuel ≈ " + EUR.format(M.projection) + " (moyenne 3 mois : " + EUR.format(M.avg3) + "). À confirmer après le 10.");
    else if (v >= 0.05) add("up", "Mois en hausse : " + pct(v), "Sécurisez chauffeurs et véhicules pour absorber la charge.");
    else if (v <= -0.05) add("down", "Mois en baisse : " + pct(v), "Relancez Ecotime et contactez vos prospects dès maintenant.");
    else add("info", "Activité stable", "Projection " + EUR.format(M.projection) + ", dans la moyenne."); }
  if (M.avg3 && M.avgPrev3) { const v = M.avg3 / M.avgPrev3 - 1; add(v >= 0 ? "up" : "down", "Tendance de fond : " + pct(v), "3 derniers mois vs les 3 précédents."); }
  const wd = [0, 0, 0, 0, 0, 0, 0]; let n = 0;
  M.sales.forEach(x => { const p = x.date.slice(0, 10).split("-").map(Number), w = new Date(p[0], p[1] - 1, p[2], 12).getDay(); if (!isNaN(w)) { wd[w] += x.amount; n++; } });
  if (n > 20) { const best = wd.indexOf(Math.max(...wd)), worst = [1, 2, 3, 4, 5].reduce((a, b) => wd[a] <= wd[b] ? a : b);
    add("info", "Jour le plus rentable : le " + DAYS[best], "Le " + DAYS[worst] + " est le plus calme : entretien, congés, prospection."); }
  const cl = groupCA(M.ytd, x => x.client); if (cl.length && cl[0].ca / (M.caYtd || 1) > (DATA.maxShareTopClient || 0.8))
    add("down", Math.round(cl[0].ca / M.caYtd * 100) + " % du CA vient de " + cl[0].key, "Voir le plan d'action dans « Clients & prospection ».");
  return t.join("");
}

          '<div class="pcard">' + (p.link ? '<a href="' + esc(p.link) + '">' + esc(p.name) + "</a>" : "<b>" + esc(p.name) + "</b>") +
          ' <span class="badge ' + esc((p.potential || "").toLowerCase()) + '">' + esc(p.potential || "?") + "</span><p>" + esc(p.why) + "</p>" +
          (p.next ? '<span class="muted">➜ ' + esc(p.next) + (p.date ? " · " + esc(p.date) : "") + "</span>" : "") + "</div>").join("") + "</div>"; }).join("") + "</div>") +
    "</div>";
}

function pageActivity(el) {
  el.innerHTML = '<div class="grid g2">' + DATA.activities.map(a => {
    const type = a.id === "Mailing" ? "conf" : "ldv", docs = DATA.docs.filter(x => x.type === type);
    let pill = '<span class="pill ok">● En service</span>';
    if (a.lastErrors) pill = '<span class="pill bad">▲ ' + a.lastErrors + " erreur(s)</span>";
    else if (a.lastStart && a.lastRun && a.lastStart !== a.lastRun) pill = '<span class="pill warn">● Passage en cours</span>';
    return '<div class="card"><h2><span class="dot" style="background:var(--s-' + type + ')"></span>' + esc(a.label) + ' <span style="margin-left:auto">' + pill + "</span></h2>" +
      '<p class="muted small" style="margin:-6px 0 12px">' + esc(a.source) + "</p>" +
      '<div class="grid g4">' + tile("Archivés", String(docs.filter(x => statusKind(x.status) === "ok").length)) + tile("À vérifier", String(docs.filter(x => statusKind(x.status) !== "ok").length)) +
      tile("En attente", a.pending == null ? "—" : String(a.pending)) + tile("Ce mois", String(docs.filter(x => (x.date || "").slice(0, 7) === M.thisMonth).length)) + "</div>" +
      '<p class="small" style="margin:12px 0 0">Dernier passage : <b>' + esc(a.lastRun || "—") + "</b>" + (a.folderUrl ? ' · <a href="' + esc(a.folderUrl) + '">Dossier Drive ↗</a>' : "") + (a.journalUrl ? ' · <a href="' + esc(a.journalUrl) + '">Journal ↗</a>' : "") + "</p>" +
      (a.lastError ? '<p class="pill bad" style="white-space:normal;margin-top:8px">Dernière erreur : ' + esc(a.lastError) + "</p>" : "") + "</div>";
  }).join("") + "</div>" +
  '<div class="card" style="margin-top:16px"><h2>Documents à vérifier <span class="muted small" style="font-weight:400">lecture incertaine, listings, factures, documents non lus</span></h2><div id="tv"></div></div>';
  dataTable(document.getElementById("tv"), M.toCheck, [
    { key: "date", label: "Date", html: x => fmtDate(x.date) },
    { key: "type", label: "Type", html: x => '<span class="dot" style="background:var(--s-' + x.type + ')"></span> ' + (x.type === "conf" ? "Confirmation" : "Lettre de voiture") },
    { key: "name", label: "Fichier", html: x => esc(short(x.name, 48)) },
    { key: "status", label: "Motif", html: x => '<span class="small">' + esc(short(x.status, 110)) + "</span>" },
  ], { state: (view.tv = view.tv || {}), sort: "date", onRow: openDoc });
}

/* ---------- Démarrage ---------- */
document.getElementById("refresh").onclick = load;
document.getElementById("menuBtn").onclick = () => document.getElementById("side").classList.toggle("open");
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (DATA && !location.hash.replace(/^#\/?/, "")) route(); }, 200); });
load();
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
